<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホの画面幅に合わせて自動リサイズさせるための必須タグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モバイルメニュー</title>
  <style>
    /* 全体のアタリを調整 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #020617; /* 全体背景（メニューとなじむダークカラー） */
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mobile-menu {
      width: 100%;       /* スマホ画面に合わせて可変 */
      max-width: 440px;  /* タブレット・PCで広がりすぎない上限 */
      margin: 0 auto;
      padding: 16px;
      background: #0f172a; /* 深みのあるダークブルー背景 */
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .mobile-menu a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 17px;         /* 指で視認しやすい少し大きめのサイズ */
      min-height: 56px;        /* タップしやすい十分な高さ（指の接触面積を確保） */
      padding: 12px 20px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      text-decoration: none;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(8px);
      -webkit-tap-highlight-color: transparent; /* タップ時のデフォルト青枠ハイライトを消去 */
    }

    /* 最後の要素の下マージンを消去 */
    .mobile-menu a:last-child {
      margin-bottom: 0;
    }

    /* 右側の矢印アイコン */
    .mobile-menu a::after {
      content: '›';
      font-size: 24px;
      line-height: 1;
      color: #38bdf8;
      transition: transform 0.2s ease;
    }

    /* タップ・ホバー時の効果 */
    .mobile-menu a:hover,
    .mobile-menu a:focus {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.5);
      color: #38bdf8;
    }

    /* タップした瞬間（スマホ操作で最も重要なレスポンス） */
    .mobile-menu a:active {
      transform: scale(0.98);
      background: rgba(56, 189, 248, 0.25);
    }

    .mobile-menu a:active::after {
      transform: translateX(4px);
    }
  </style>
</head>
