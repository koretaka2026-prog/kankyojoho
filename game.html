<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>フルーツキャッチ！</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 80vh;
            max-height: 600px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 4px solid #fff;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        .fruit {
            position: absolute;
            font-size: 2rem;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #basket {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.5rem;
            width: 80px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: transform 0.05s linear;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 10;
        }
        #overlay h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #overlay p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
        }
        .btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #e64a19;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>スコア: <span id="score">0</span></div>
        <div>残り時間: <span id="time">30</span>秒</div>
    </div>

    <div id="game-container">
        <div id="basket">🧺</div>
        <div id="overlay">
            <h1>🍎 フルーツキャッチ 🍌</h1>
            <p>画面をタッチ＆ドラッグしてカゴを動かし、落ちてくるフルーツをたくさんキャッチしよう！<br>※💣爆弾に注意！</p>
            <button class="btn" id="start-btn">スタート</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const basket = document.getElementById('basket');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let fruitInterval = null;
        let isPlaying = false;
        let fruits = [];

        // カゴの位置（コンテナ内でのX座標パーセンテージ）
        let basketX = 50;

        const items = [
            { emoji: '🍎', points: 10, type: 'fruit' },
            { emoji: '🍌', points: 15, type: 'fruit' },
            { emoji: '🍇', points: 20, type: 'fruit' },
            { emoji: '🍉', points: 30, type: 'fruit' },
            { emoji: '💣', points: -20, type: 'bomb' }
        ];

        // タッチ＆マウス操作の共通処理
        function handleMove(clientX) {
            if (!isPlaying) return;
            const rect = gameContainer.getBoundingClientRect();
            let x = clientX - rect.left;
            let percentage = (x / rect.width) * 100;
            
            // 範囲制限 (10% ~ 90%)
            if (percentage < 10) percentage = 10;
            if (percentage > 90) percentage = 90;
            
            basketX = percentage;
            basket.style.left = `${basketX}%`;
        }

        gameContainer.addEventListener('mousemove', (e) => {
            handleMove(e.clientX);
        });

        gameContainer.addEventListener('touchmove', (e) => {
            handleMove(e.touches[0].clientX);
            e.preventDefault();
        }, { passive: false });

        // ゲームスタート
        function startGame() {
            // 初期化
            score = 0;
            timeLeft = 30;
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            overlay.style.display = 'none';
            isPlaying = true;
            basketX = 50;
            basket.style.left = `${basketX}%`;

            // 既存のフルーツを削除
            fruits.forEach(f => f.element.remove());
            fruits = [];

            // タイマー開始
            gameInterval = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // フルーツ生成開始
            fruitInterval = setInterval(spawnFruit, 600);
        }

        // フルーツ生成
        function spawnFruit() {
            if (!isPlaying) return;

            // ランダムにアイテム選定 (爆弾は低確率)
            const rand = Math.random();
            let itemData;
            if (rand < 0.2) {
                itemData = items[4]; // 爆弾
            } else if (rand < 0.5) {
                itemData = items[3]; // スイカ
            } else if (rand < 0.7) {
                itemData = items[2]; // ぶどう
            } else if (rand < 0.85) {
                itemData = items[1]; // バナナ
            } else {
                itemData = items[0]; // リンゴ
            }

            const el = document.createElement('div');
            el.className = 'fruit';
            el.textContent = itemData.emoji;
            
            const startX = Math.random() * 80 + 10; // 10% ~ 90%
            el.style.left = `${startX}%`;
            el.style.top = `-30px`;
            
            gameContainer.appendChild(el);

            fruits.push({
                element: el,
                x: startX,
                y: -30,
                speed: Math.random() * 2 + 2.5, // 落ちる速度
                points: itemData.points,
                type: itemData.type
            });
        }

        // メインゲームループ（アニメーション）
        function update() {
            if (isPlaying) {
                const containerHeight = gameContainer.clientHeight;
                
                for (let i = fruits.length - 1; i >= 0; i--) {
                    let f = fruits[i];
                    f.y += f.speed;
                    f.element.style.top = `${f.y}px`;

                    // カゴとの当たり判定 (画面下部付近)
                    if (f.y >= containerHeight - 90 && f.y <= containerHeight - 20) {
                        // X座標の距離を計算（簡易判定）
                        let distance = Math.abs(f.x - basketX);
                        if (distance < 12) {
                            // キャッチ成功！
                            score += f.points;
                            if (score < 0) score = 0;
                            scoreEl.textContent = score;

                            // エフェクト演出
                            basket.style.transform = `translateX(-50%) scale(1.2)`;
                            setTimeout(() => {
                                basket.style.transform = `translateX(-50%) scale(1.0)`;
                            }, 50);

                            f.element.remove();
                            fruits.splice(i, 1);
                            continue;
                        }
                    }

                    // 画面外に出たら削除
                    if (f.y > containerHeight + 40) {
                        f.element.remove();
                        fruits.splice(i, 1);
                    }
                }
            }
            requestAnimationFrame(update);
        }

        // ゲーム終了
        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(fruitInterval);

            overlay.style.display = 'flex';
            overlay.querySelector('h1').textContent = '🎉 ゲーム終了！ 🎉';
            overlay.querySelector('p').innerHTML = `あなたのスコアは <strong>${score}点</strong> でした！<br>もう一度遊ぶ？`;
            startBtn.textContent = 'もう一度プレイ';
        }

        startBtn.addEventListener('click', startGame);

        // ループ開始
        requestAnimationFrame(update);
    </script>
</body>
</html>
