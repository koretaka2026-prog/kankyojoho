<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>フォレスト・スピリット 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a2e1a;
            font-family: 'Zen Maru Gothic', sans-serif;
            color: #ffffff;
        }

        .forest-panel {
            background: rgba(20, 38, 25, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(134, 239, 172, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .forest-btn {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.3), rgba(22, 101, 52, 0.6));
            border: 2px solid #86efac;
            color: #ffffff;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .forest-btn:hover, .forest-btn:active {
            background: #86efac;
            color: #14532d;
            box-shadow: 0 0 20px rgba(134, 239, 172, 0.6);
        }

        /* ミニマップ用スタイル（画面左下常設型） */
        #minimap-container {
            background: rgba(20, 38, 25, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(134, 239, 172, 0.6);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        #minimap-canvas {
            background: #102015;
            border: 1.5px solid #86efac;
            border-radius: 50%;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- 3D Canvas -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- ================= UI OVERLAY ================= -->
    <div id="ui-container" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-4 sm:p-6">
        
        <!-- Header Info Bar -->
        <div class="flex justify-between items-start w-full gap-2">
            <!-- Title & Mission Info -->
            <div class="forest-panel p-3 sm:p-4 rounded-2xl pointer-events-auto flex items-center gap-3">
                <i class="fa-solid fa-tree text-2xl sm:text-3xl text-green-400"></i>
                <div>
                    <div class="font-bold text-base sm:text-lg text-emerald-200 tracking-wide">
                        フォレスト・スピリット
                    </div>
                    <div class="text-xs text-emerald-100/80">集めた光のしずく: <span id="orb-count" class="text-amber-300 font-bold text-sm">0</span> / <span id="orb-total">8</span></div>
                </div>
            </div>

            <!-- Goal Indicator & Map Toggle Button -->
            <div class="flex items-center gap-3 pointer-events-auto">
                <div id="goal-panel" class="forest-panel p-3 rounded-2xl hidden sm:flex items-center gap-2">
                    <i class="fa-solid fa-sun text-amber-300 animate-pulse text-lg"></i>
                    <div class="text-xs font-bold text-amber-100">
                        <span id="goal-text">森の光を集めよう</span>
                    </div>
                </div>

                <!-- Map Toggle Button -->
                <button id="btn-map-toggle" class="forest-panel px-3 py-2 rounded-2xl flex items-center gap-2 text-xs font-bold text-emerald-200 hover:text-white transition-all pointer-events-auto active:scale-95">
                    <i class="fa-solid fa-map text-amber-300 text-sm"></i>
                    <span>MAP <span class="hidden sm:inline text-[10px] text-emerald-300">(M)</span></span>
                </button>
            </div>
        </div>

        <!-- Center Toast Notification -->
        <div id="msg-toast" class="self-center forest-panel px-5 py-2.5 rounded-full text-xs sm:text-sm font-bold text-emerald-200 opacity-0 transition-opacity duration-300 pointer-events-none border-emerald-400">
            光のしずくをみつけた！
        </div>

        <!-- Bottom Controls & Instructions -->
        <div class="flex flex-col items-center gap-3 w-full">
            <!-- Mobile Touch D-Pad / Controls -->
            <div class="flex justify-between items-end w-full max-w-md pointer-events-auto sm:hidden px-2">
                <!-- Virtual Joystick Touch Area Indicator -->
                <div class="forest-panel p-3 rounded-2xl text-[10px] text-emerald-200/80 text-center w-full">
                    <i class="fa-solid fa-hand-pointer mr-1"></i> 画面スワイプ: 移動 & 視点操作
                </div>
                <button id="btn-jump-mobile" class="forest-btn p-4 rounded-2xl ml-2 flex items-center justify-center text-lg active:scale-95 shadow-lg">
                    <i class="fa-solid fa-angles-up"></i>
                </button>
            </div>

            <!-- Desktop Keyboard Instructions -->
            <div class="forest-panel hidden sm:flex px-6 py-2.5 rounded-2xl text-xs text-emerald-100 gap-6 border-emerald-400/50">
                <div><span class="text-emerald-300 font-bold">W A S D / 矢印</span> : 移動</div>
                <div><span class="text-emerald-300 font-bold">SPACE</span> : ジャンプ</div>
                <div><span class="text-emerald-300 font-bold">M</span> : マップ表示</div>
                <div><span class="text-emerald-300 font-bold">クリック / マウス</span> : 視点操作</div>
            </div>
        </div>
    </div>

    <!-- Bottom Left Compact Minimap Overlay (初期非表示: hidden 追加) -->
    <div id="minimap-container" class="absolute bottom-4 left-4 z-20 pointer-events-auto rounded-3xl p-3 flex flex-col items-center gap-1.5 shadow-2xl transition-all duration-300 hidden">
        <!-- Legend Indicator -->
        <div class="flex justify-center gap-2 text-[9px] font-bold text-emerald-200/90 w-full px-1">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>自分</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-300"></span>しずく</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-sky-400"></span>祭壇</span>
        </div>
        
        <!-- Minimap Canvas -->
        <canvas id="minimap-canvas" width="130" height="130" class="shadow-md"></canvas>
    </div>

    <!-- Start Overlay Modal -->
    <div id="start-overlay" class="absolute inset-0 z-30 flex items-center justify-center p-4 bg-emerald-950/80 backdrop-blur-md">
        <div class="forest-panel max-w-md w-full rounded-3xl p-6 sm:p-8 text-center border-emerald-400/60 shadow-2xl">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-300">
                <i class="fa-solid fa-leaf text-3xl text-emerald-300"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-emerald-100 mb-2">
                フォレスト・スピリット 3D
            </h1>
            <p class="text-xs sm:text-sm text-emerald-200/90 leading-relaxed mb-6">
                あなたは森の小さな守護精霊です。<br>
                緑豊かな森を探索し、失われた<span class="text-amber-300 font-bold">「8つの光のしずく」</span>をすべて集めて中央の古き祭壇へ届けてください。
            </p>

            <button id="btn-start" class="forest-btn w-full py-4 rounded-2xl font-bold text-sm sm:text-base tracking-wider shadow-lg">
                <i class="fa-solid fa-play mr-2"></i> 森を探索する
            </button>
        </div>
    </div>

    <!-- Game Victory Modal -->
    <div id="victory-overlay" class="absolute inset-0 z-30 hidden flex items-center justify-center p-4 bg-emerald-950/85 backdrop-blur-md">
        <div class="forest-panel max-w-md w-full rounded-3xl p-8 text-center border-amber-300 shadow-2xl">
            <i class="fa-solid fa-sun text-5xl text-amber-300 mb-4 animate-bounce"></i>
            <h2 class="text-2xl font-bold text-amber-200 mb-2">森に光が戻りました！</h2>
            <p class="text-xs sm:text-sm text-emerald-100 mb-6">
                すべての光のしずくが集まり、森の平和が守られました。静かな森の旅を完了しました！
            </p>
            <button id="btn-restart" class="forest-btn w-full py-3.5 rounded-2xl font-bold text-sm">
                <i class="fa-solid fa-rotate-right mr-2"></i> もう一度あそぶ
            </button>
        </div>
    </div>

    <!-- Game Engine -->
    <script>
        // ==========================================
        // Sound Engine (Web Audio API - Natural FX)
        // ==========================================
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }
            playCollect() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.3);
            }
            playJump() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.1);
            }
            playWin() {
                if (!this.ctx) return;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, i) => {
                    const now = this.ctx.currentTime + i * 0.12;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now); osc.stop(now + 0.4);
                });
            }
        }
        const sfx = new SoundFX();

        // ==========================================
        // World & Scene Variables
        // ==========================================
        let scene, camera, renderer;
        let player, playerBody;
        let orbs = [];
        let altar;
        let platforms = []; // 空中の足場
        let pitHole = { x: 30, z: -20, radius: 4.5, depth: 5.5 }; // 地面の穴
        let collectedCount = 0;
        const TOTAL_ORBS = 8;

        // Physics / Movement
        const playerVel = new THREE.Vector3();
        let isGrounded = true;
        const moveState = { forward: false, backward: false, left: false, right: false };
        
        // Camera Controls
        let cameraAngleX = 0;
        let cameraAngleY = 0.3;
        let isPointerLocked = false;
        let isMapVisible = false; // 初期状態は非表示

        // Mobile Controls
        let touchLeftId = null, touchRightId = null;
        let touchStartX = 0, touchStartY = 0;

        // ==========================================
        // World Initialization
        // ==========================================
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a4731);
            scene.fog = new THREE.FogExp2(0x2a4731, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xd4f7d4, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5cc, 1.3);
            sunLight.position.set(30, 50, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Terrain & Vegetation
            buildTerrain();
            buildForestProps();

            // Player Creation (Spirit Creature)
            createPlayer();

            // Collectibles & Goal Altar
            spawnAltar();
            spawnOrbs();

            // Event Listeners
            initEvents();
        }

        // ==========================================
        // Environment Builders
        // ==========================================
        function buildTerrain() {
            // Main Grass Floor
            const geo = new THREE.PlaneGeometry(160, 160, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x3a633d,
                roughness: 0.9,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(geo, mat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 地面の穴（洞窟の入り口風のリング＆深い穴の内部）を建設
            buildPitHole();

            // Surrounding Hills / Barrier
            const hillGeo = new THREE.ConeGeometry(12, 16, 8);
            const hillMat = new THREE.MeshStandardMaterial({ color: 0x213d25, roughness: 1.0 });
            for (let i = 0; i < 30; i++) {
                const angle = (i / 30) * Math.PI * 2;
                const radius = 70 + Math.random() * 8;
                const hill = new THREE.Mesh(hillGeo, hillMat);
                hill.position.set(Math.cos(angle) * radius, 6, Math.sin(angle) * radius);
                hill.scale.set(1 + Math.random(), 0.8 + Math.random() * 0.5, 1 + Math.random());
                scene.add(hill);
            }
        }

        function buildForestProps() {
            // Trees
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.7, 4, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18 });
            const leavesGeo = new THREE.DodecahedronGeometry(2.5, 1);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.8 });

            for (let i = 0; i < 70; i++) {
                const x = (Math.random() - 0.5) * 120;
                const z = (Math.random() - 0.5) * 120;
                if (Math.hypot(x, z) < 10) continue; // Keep altar center clear

                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 2;
                trunk.castShadow = true;
                tree.add(trunk);

                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 4.8;
                leaves.castShadow = true;
                tree.add(leaves);

                tree.position.set(x, 0, z);
                scene.add(tree);
            }

            // Flowers / Mushrooms
            const flowerGeo = new THREE.SphereGeometry(0.2, 6, 6);
            const flowerMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, emissive: 0xf472b6, emissiveIntensity: 0.3 });
            for (let i = 0; i < 80; i++) {
                const flower = new THREE.Mesh(flowerGeo, flowerMat);
                flower.position.set((Math.random() - 0.5) * 130, 0.2, (Math.random() - 0.5) * 130);
                scene.add(flower);
            }

            // 空中の古代の足場（跳び移るためのプラットフォーム）
            buildPlatforms();
        }

        function buildPitHole() {
            // 穴のフチ（黒っぽい岩の縁取り）
            const rimGeo = new THREE.RingGeometry(3.8, 5.0, 24);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0x27272a, side: THREE.DoubleSide });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = -Math.PI / 2;
            rim.position.set(pitHole.x, 0.02, pitHole.z);
            scene.add(rim);

            // 穴の底（黒い底面）
            const bottomGeo = new THREE.CircleGeometry(4.0, 24);
            const bottomMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 1.0 });
            const bottom = new THREE.Mesh(bottomGeo, bottomMat);
            bottom.rotation.x = -Math.PI / 2;
            bottom.position.set(pitHole.x, -pitHole.depth, pitHole.z);
            bottom.receiveShadow = true;
            scene.add(bottom);

            // 穴の内壁（円筒）
            const wallGeo = new THREE.CylinderGeometry(4.0, 4.0, pitHole.depth, 24, 1, true);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x27272a, side: THREE.BackSide, roughness: 0.9 });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(pitHole.x, -pitHole.depth / 2, pitHole.z);
            scene.add(wall);
        }

        function buildPlatforms() {
            const platGeo = new THREE.BoxGeometry(4, 0.6, 4);
            const platMat = new THREE.MeshStandardMaterial({ color: 0x78716c, roughness: 0.8 });

            // 1段階目の足場 (地上からの跳び乗り用)
            const p1 = new THREE.Mesh(platGeo, platMat);
            p1.position.set(-35, 3.5, -5);
            p1.castShadow = true;
            p1.receiveShadow = true;
            scene.add(p1);
            platforms.push({ x: -35, z: -5, y: 3.5, radius: 2.2 });

            // 2段階目の足場 (中継地点)
            const p2 = new THREE.Mesh(platGeo, platMat);
            p2.position.set(-35, 7.0, -10);
            p2.castShadow = true;
            p2.receiveShadow = true;
            scene.add(p2);
            platforms.push({ x: -35, z: -10, y: 7.0, radius: 2.2 });

            // 3段階目の最上段足場 (光のしずくが載っている場所)
            const p3 = new THREE.Mesh(platGeo, platMat);
            p3.position.set(-35, 10.5, -15);
            p3.castShadow = true;
            p3.receiveShadow = true;
            scene.add(p3);
            platforms.push({ x: -35, z: -15, y: 10.5, radius: 2.2 });
        }

        function createPlayer() {
            player = new THREE.Group();

            // Spirit Glowing Body (少しぽってりとしたかわいらしい形状に)
            const bodyGeo = new THREE.SphereGeometry(0.7, 24, 24);
            bodyGeo.scale(1.0, 0.92, 1.0); // 少し横長でぽってり
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0xdcfce7,
                emissive: 0x86efac,
                emissiveIntensity: 0.5,
                roughness: 0.2
            });
            playerBody = new THREE.Mesh(bodyGeo, bodyMat);
            playerBody.position.y = 0.8;
            playerBody.castShadow = true;
            player.add(playerBody);

            // 顔パーツ用のグループ（体の変形・伸縮の影響を受けないよう独立）
            const faceGroup = new THREE.Group();
            faceGroup.position.set(0, 0.8, 0);
            player.add(faceGroup);

            // Spirit Eyes (大きめのくりっくりな目 - 体の表面よりしっかり前に配置)
            const eyeGeo = new THREE.SphereGeometry(0.13, 16, 16);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x14532d });
            
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.24, 0.12, 0.64);
            
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.24, 0.12, 0.64);

            // Eye Highlights (目にキラキラした白いハイライト)
            const highlightGeo = new THREE.SphereGeometry(0.045, 8, 8);
            const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            const leftHighlight = new THREE.Mesh(highlightGeo, highlightMat);
            leftHighlight.position.set(-0.20, 0.16, 0.73);
            
            const rightHighlight = new THREE.Mesh(highlightGeo, highlightMat);
            rightHighlight.position.set(0.28, 0.16, 0.73);

            faceGroup.add(leftEye); faceGroup.add(rightEye);
            faceGroup.add(leftHighlight); faceGroup.add(rightHighlight);

            // Cheeks (ほんのりピンクのほっぺ)
            const cheekGeo = new THREE.SphereGeometry(0.09, 8, 8);
            cheekGeo.scale(1.2, 0.6, 0.5);
            const cheekMat = new THREE.MeshBasicMaterial({ color: 0xf472b6 });
            
            const leftCheek = new THREE.Mesh(cheekGeo, cheekMat);
            leftCheek.position.set(-0.33, 0.01, 0.62);
            
            const rightCheek = new THREE.Mesh(cheekGeo, cheekMat);
            rightCheek.position.set(0.33, 0.01, 0.62);

            faceGroup.add(leftCheek); faceGroup.add(rightCheek);

            // Cute Ears (ぴょこっと生えた小さな精霊のみみ)
            const earGeo = new THREE.ConeGeometry(0.18, 0.5, 12);
            earGeo.rotateX(-0.2);
            const earMat = new THREE.MeshStandardMaterial({
                color: 0xbbf7d0,
                emissive: 0x86efac,
                emissiveIntensity: 0.4,
                roughness: 0.3
            });

            const leftEar = new THREE.Mesh(earGeo, earMat);
            leftEar.position.set(-0.38, 1.32, 0.05);
            leftEar.rotation.z = 0.35;

            const rightEar = new THREE.Mesh(earGeo, earMat);
            rightEar.position.set(0.38, 1.32, 0.05);
            rightEar.rotation.z = -0.35;

            playerBody.add(leftEar);
            playerBody.add(rightEar);

            // Soft Light Source around Spirit
            const spiritLight = new THREE.PointLight(0x86efac, 1.2, 8);
            spiritLight.position.y = 1;
            player.add(spiritLight);

            player.position.set(0, 0, 15);
            scene.add(player);
        }

        function spawnAltar() {
            altar = new THREE.Group();

            // Stone Base
            const baseGeo = new THREE.CylinderGeometry(3.5, 4, 0.8, 8);
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.9 });
            const base = new THREE.Mesh(baseGeo, stoneMat);
            base.position.y = 0.4;
            base.receiveShadow = true;
            altar.add(base);

            // Ancient Pillars
            const pillarGeo = new THREE.CylinderGeometry(0.3, 0.4, 2.5, 6);
            for (let i = 0; i < 4; i++) {
                const angle = (i / 4) * Math.PI * 2;
                const pillar = new THREE.Mesh(pillarGeo, stoneMat);
                pillar.position.set(Math.cos(angle) * 2.5, 1.6, Math.sin(angle) * 2.5);
                pillar.castShadow = true;
                altar.add(pillar);
            }

            altar.position.set(0, 0, 0);
            scene.add(altar);
        }

        function spawnOrbs() {
            const orbGeo = new THREE.SphereGeometry(0.4, 12, 12);
            const orbMat = new THREE.MeshStandardMaterial({
                color: 0xfef08a,
                emissive: 0xeab308,
                emissiveIntensity: 0.8
            });

            const positions = [
                { x: 15, z: 15, h: 2.8 }, { x: -20, z: 10, h: 2.8 }, 
                { x: 25, z: -15, h: 2.8 }, { x: -15, z: -25, h: 2.8 },
                { x: 35, z: 5, h: 2.8 },  { x: -30, z: 30, h: 2.8 }, 
                { x: pitHole.x, z: pitHole.z, h: -4.0 }, // 7つ目：地面の穴の中
                { x: -35, z: -15, h: 10.5 } // 8つ目：高くなった最上段足場の上に配置
            ];

            positions.forEach((pos, idx) => {
                const orbGroup = new THREE.Group();
                const mesh = new THREE.Mesh(orbGeo, orbMat);
                mesh.position.y = pos.h;
                mesh.castShadow = true;
                orbGroup.add(mesh);

                const light = new THREE.PointLight(0xfde047, 1, 5);
                light.position.y = pos.h;
                orbGroup.add(light);

                orbGroup.position.set(pos.x, 0, pos.z);
                orbGroup.userData = { id: idx, baseHeight: pos.h };

                scene.add(orbGroup);
                orbs.push(orbGroup);
            });

            document.getElementById('orb-total').innerText = TOTAL_ORBS;
        }

        // ==========================================
        // Event Listeners & Interaction
        function initEvents() {
            const container = document.getElementById('canvas-container');

            // Keyboard Controls
            window.addEventListener('keydown', (e) => {
                if (e.key === 'm' || e.key === 'M') {
                    toggleMap();
                    return;
                }
                if (['w', 'W', 'ArrowUp'].includes(e.key)) moveState.forward = true;
                if (['s', 'S', 'ArrowDown'].includes(e.key)) moveState.backward = true;
                if (['a', 'A', 'ArrowLeft'].includes(e.key)) moveState.left = true;
                if (['d', 'D', 'ArrowRight'].includes(e.key)) moveState.right = true;
                if (e.code === 'Space') { e.preventDefault(); jump(); }
            });

            window.addEventListener('keyup', (e) => {
                if (['w', 'W', 'ArrowUp'].includes(e.key)) moveState.forward = false;
                if (['s', 'S', 'ArrowDown'].includes(e.key)) moveState.backward = false;
                if (['a', 'A', 'ArrowLeft'].includes(e.key)) moveState.left = false;
                if (['d', 'D', 'ArrowRight'].includes(e.key)) moveState.right = false;
            });

            // Pointer Lock for Mouse Look
            container.addEventListener('click', () => {
                if (!isPointerLocked && document.getElementById('start-overlay').classList.contains('hidden')) {
                    container.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === container);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                cameraAngleX -= e.movementX * 0.003;
                cameraAngleY += e.movementY * 0.003;
                cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2.5, cameraAngleY));
            });

            // Map UI Events
            document.getElementById('btn-map-toggle').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMap();
            });

            // Mobile Jump Button
            const mobileJumpBtn = document.getElementById('btn-jump-mobile');
            if (mobileJumpBtn) {
                mobileJumpBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    jump();
                });
            }

            // Touch Drag / Swipe Support
            window.addEventListener('touchstart', (e) => {
                for (let touch of e.changedTouches) {
                    if (touchLeftId === null) {
                        touchLeftId = touch.identifier;
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === touchLeftId) {
                        const dx = touch.clientX - touchStartX;
                        const dy = touch.clientY - touchStartY;
                        moveState.forward = dy < -10;
                        moveState.backward = dy > 10;
                        moveState.left = dx < -10;
                        moveState.right = dx > 10;

                        // Camera Look with touch swipe
                        cameraAngleX -= dx * 0.0005;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === touchLeftId) {
                        touchLeftId = null;
                        moveState.forward = moveState.backward = moveState.left = moveState.right = false;
                    }
                }
            });

            // Start & Restart Buttons
            document.getElementById('btn-start').addEventListener('click', () => {
                sfx.init();
                document.getElementById('start-overlay').classList.add('hidden');
                container.requestPointerLock();
            });

            document.getElementById('btn-restart').addEventListener('click', () => {
                location.reload();
            });

            window.addEventListener('resize', onWindowResize);

            // 初期状態は確実に非表示
            toggleMap(false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleMap(forceState) {
            isMapVisible = (forceState !== undefined) ? forceState : !isMapVisible;
            const minimapContainer = document.getElementById('minimap-container');
            if (minimapContainer) {
                if (isMapVisible) {
                    minimapContainer.classList.remove('hidden');
                } else {
                    minimapContainer.classList.add('hidden');
                }
            }
        }

        function jump() {
            if (isGrounded) {
                playerVel.y = 0.38;
                isGrounded = false;
                sfx.playJump();
            }
        }

        // ==========================================
        // Game Logic & Updates
        // ==========================================
        function updatePlayer() {
            const speed = 0.22;
            const dir = new THREE.Vector3();

            // カメラの向きに基づく移動方向の計算（左右方向を正常化）
            const forward = new THREE.Vector3(-Math.sin(cameraAngleX), 0, -Math.cos(cameraAngleX)).normalize();
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            if (moveState.forward) dir.add(forward);
            if (moveState.backward) dir.sub(forward);
            if (moveState.left) dir.sub(right);
            if (moveState.right) dir.add(right);

            if (dir.lengthSq() > 0) {
                dir.normalize().multiplyScalar(speed);
                player.position.x += dir.x;
                player.position.z += dir.z;

                // 進行方向へスムーズに回転
                const targetRotation = Math.atan2(dir.x, dir.z);
                player.rotation.y = targetRotation;

                // 歩行時のぴょこぴょこアニメーション
                const t = Date.now() * 0.012;
                playerBody.scale.set(
                    1 + Math.sin(t) * 0.05,
                    0.92 + Math.cos(t) * 0.05,
                    1 + Math.sin(t) * 0.05
                );
            } else {
                // 待機時のフワフワ呼吸アニメーション
                const t = Date.now() * 0.003;
                playerBody.scale.set(1, 0.92 + Math.sin(t) * 0.03, 1);
            }

            // 重力処理（よりふんわりとした浮遊感へ軽減）
            playerVel.y -= 0.009;
            player.position.y += playerVel.y;

            // 地面・足場・穴の高さ計算
            let groundY = 0;

            // 穴（Pit Hole）の中にいるかの判定
            const distToPit = Math.hypot(player.position.x - pitHole.x, player.position.z - pitHole.z);
            if (distToPit < pitHole.radius) {
                groundY = -pitHole.depth; // 穴の底
            } else {
                // 空中足場（Platforms）の上にいるかの判定
                for (let plat of platforms) {
                    const distToPlat = Math.hypot(player.position.x - plat.x, player.position.z - plat.z);
                    if (distToPlat < plat.radius && player.position.y >= plat.y) {
                        groundY = plat.y + 0.3;
                        break;
                    }
                }
            }

            // 着地処理
            if (player.position.y <= groundY) {
                player.position.y = groundY;
                playerVel.y = 0;
                isGrounded = true;
            }

            // 移動範囲制限（エリア外落下防止）
            const maxBoundary = 72;
            player.position.x = Math.max(-maxBoundary, Math.min(maxBoundary, player.position.x));
            player.position.z = Math.max(-maxBoundary, Math.min(maxBoundary, player.position.z));
        }

        function updateCamera() {
            // 三人称（TPS）カメラの追従計算
            const distance = 11;
            const camX = player.position.x + Math.sin(cameraAngleX) * distance * Math.cos(cameraAngleY);
            const camY = player.position.y + Math.sin(cameraAngleY) * distance + 1.5;
            const camZ = player.position.z + Math.cos(cameraAngleX) * distance * Math.cos(cameraAngleY);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
        }

        function checkCollectibles() {
            orbs.forEach((orbGroup) => {
                if (!orbGroup.visible) return;

                // 距離判定（高さYもチェック）
                const distXZ = Math.hypot(player.position.x - orbGroup.position.x, player.position.z - orbGroup.position.z);
                const orbY = orbGroup.userData.baseHeight;
                const distY = Math.abs(player.position.y - orbY);

                // 近距離かつ高さが適合している場合に取得（判定範囲を拡大: distXZ < 2.5, distY < 1.5）
                if (distXZ < 2.5 && distY < 1.5) {
                    orbGroup.visible = false;
                    collectedCount++;
                    sfx.playCollect();

                    // UI更新
                    document.getElementById('orb-count').innerText = collectedCount;
                    showToast('光のしずくをゲットした！');

                    if (collectedCount === TOTAL_ORBS) {
                        document.getElementById('goal-panel').classList.remove('hidden');
                        document.getElementById('goal-text').innerText = '中央の古き祭壇へ移動しよう！';
                        showToast('すべての光のしずくが集まりました！祭壇へ向かいましょう！');
                    }
                }

                // 光のしずくの浮遊・回転アニメーション
                if (orbGroup.visible) {
                    const time = Date.now() * 0.003;
                    orbGroup.children[0].position.y = orbY + Math.sin(time + orbGroup.userData.id) * 0.2;
                    orbGroup.rotation.y += 0.02;
                }
            });

            // 祭壇（Goal）到達判定
            if (collectedCount === TOTAL_ORBS) {
                const distToAltar = Math.hypot(player.position.x - altar.position.x, player.position.z - altar.position.z);
                if (distToAltar < 3.0) {
                    sfx.playWin();
                    document.exitPointerLock();
                    document.getElementById('victory-overlay').classList.remove('hidden');
                }
            }
        }

        function showToast(text) {
            const toast = document.getElementById('msg-toast');
            toast.innerText = text;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2500);
        }

        // ==========================================
        // Minimap Render Logic
        // ==========================================
        function drawMinimap() {
            if (!isMapVisible) return;
            const canvas = document.getElementById('minimap-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const center = w / 2;
            const mapScale = 0.8; // 3D空間座標とミニマップ座標のスケール変換比

            // 背景クリア
            ctx.clearRect(0, 0, w, h);

            // 祭壇 (青い円)
            const altarX = center + (altar.position.x - player.position.x) * mapScale;
            const altarY = center + (altar.position.z - player.position.z) * mapScale;
            if (Math.hypot(altarX - center, altarY - center) < center - 4) {
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(altarX, altarY, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 残りの「光のしずく」 (黄色い円)
            orbs.forEach(orb => {
                if (orb.visible) {
                    const ox = center + (orb.position.x - player.position.x) * mapScale;
                    const oy = center + (orb.position.z - player.position.z) * mapScale;
                    if (Math.hypot(ox - center, oy - center) < center - 6) {
                        ctx.fillStyle = '#fde047';
                        ctx.beginPath();
                        ctx.arc(ox, oy, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });

            // プレイヤー自身 (中央の緑の矢印：回転方向を正常化)
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(player.rotation.y);

            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(4, 5);
            ctx.lineTo(0, 3);
            ctx.lineTo(-4, 5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // ==========================================
        // Main Loop
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            updatePlayer();
            updateCamera();
            checkCollectibles();
            drawMinimap();

            renderer.render(scene, camera);
        }

        // Window Load Start
        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
