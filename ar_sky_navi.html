<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Celestial & Constellation Hunter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050814;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Reticle overlay animation */
        .reticle-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.7), 0 0 20px rgba(56, 189, 248, 0.4);
        }
        .glow-target {
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.8), 0 0 20px rgba(250, 204, 21, 0.5);
        }
        /* Custom scrollbars for modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 3px;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none bg-slate-950">

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- AR Camera Background Feed Simulation / Video Layer -->
    <video id="ar-video" class="absolute inset-0 w-full h-full object-cover z-0 hidden opacity-40" autoplay playsinline muted></video>

    <!-- UI Overlay (Z-index high) -->
    <div class="relative z-10 flex flex-col justify-between w-full h-full pointer-events-none p-4">

        <!-- Top Navigation Bar -->
        <header class="flex justify-between items-center bg-slate-900/80 backdrop-blur-md p-3 rounded-2xl border border-cyan-500/30 shadow-lg pointer-events-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-cyan-500/20">
                    <i class="fa-solid font-bold fa-compass text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-cyan-300 tracking-wide flex items-center gap-2">
                        AR 天体ハンター <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-cyan-950 border border-cyan-500/40 text-cyan-400">88星座 Ver.</span>
                    </h1>
                    <p id="orientation-status" class="text-xs text-slate-400">方位: <span id="azimuth-val" class="text-cyan-300 font-mono">000° N</span> | 仰角: <span id="altitude-val" class="text-cyan-300 font-mono">+00°</span></p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- AR Toggle Button -->
                <button id="btn-ar-toggle" class="p-2.5 px-3.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-medium text-slate-300 hover:text-white hover:border-cyan-500 transition-all flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-camera text-cyan-400"></i>
                    <span id="ar-btn-label">AR: OFF</span>
                </button>

                <!-- Audio Toggle -->
                <button id="btn-audio-toggle" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-amber-400 hover:border-amber-500/50 flex items-center justify-center transition-all">
                    <i id="audio-icon" class="fa-solid fa-volume-xmark text-sm"></i>
                </button>

                <!-- Catalog Modal Toggle Button -->
                <button id="btn-catalog" class="w-10 h-10 rounded-xl bg-cyan-600/80 hover:bg-cyan-500 border border-cyan-400/50 text-white flex items-center justify-center transition-all shadow-md shadow-cyan-600/30">
                    <i class="fa-solid fa-book-bookmark text-base"></i>
                </button>
            </div>
        </header>

        <!-- Center Reticle & Dynamic Target Badge -->
        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-20">
            <!-- Reticle Crosshair -->
            <div class="relative flex items-center justify-center">
                <div class="w-16 h-16 rounded-full border-2 border-dashed border-cyan-400/70 reticle-pulse flex items-center justify-center">
                    <div class="w-2 h-2 rounded-full bg-cyan-400 shadow-glow"></div>
                </div>
                <!-- Crosshair ticks -->
                <div class="absolute w-24 h-0.5 bg-gradient-to-r from-transparent via-cyan-400/50 to-transparent"></div>
                <div class="absolute h-24 w-0.5 bg-gradient-to-b from-transparent via-cyan-400/50 to-transparent"></div>
            </div>

            <!-- Dynamic Center Lock Badge -->
            <div id="center-lock-badge" class="mt-4 px-4 py-2 rounded-xl bg-slate-900/90 backdrop-blur-md border border-amber-500/50 shadow-xl flex items-center gap-3 transition-all duration-300 opacity-90 translate-y-0">
                <div class="relative flex items-center justify-center w-3 h-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                </div>
                <div>
                    <div class="text-[10px] uppercase font-bold text-amber-400/80 tracking-wider flex justify-between items-center gap-2">
                        <span>Target Locked</span>
                        <span id="center-target-dist" class="font-mono text-cyan-300">0.0°</span>
                    </div>
                    <div class="flex items-baseline gap-2">
                        <span id="center-target-name" class="text-sm font-bold text-white glow-target">ターゲット探知中...</span>
                        <span id="center-target-sub" class="text-xs text-slate-400 font-medium"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sensor Status Banner / Drag Mode Alert -->
        <div id="sensor-banner" class="self-center bg-slate-900/80 backdrop-blur-md border border-amber-500/40 text-amber-300 text-xs px-4 py-1.5 rounded-full flex items-center gap-2 pointer-events-auto shadow-md">
            <i class="fa-solid fa-hand-pointer text-amber-400 animate-pulse"></i>
            <span>画面ドラッグで自由に夜空を見回せます（ジャイロセンサー未接続）</span>
            <button id="btn-request-gyro" class="ml-2 bg-amber-500/20 hover:bg-amber-500/40 border border-amber-400/50 text-amber-200 px-2 py-0.5 rounded text-[10px] font-bold transition-all">
                センサー有効化
            </button>
        </div>

        <!-- Bottom Info Card & Control Panel -->
        <footer class="flex flex-col gap-3 pointer-events-auto">
            <!-- Selected Object Detail Card -->
            <div id="info-card" class="bg-slate-900/90 backdrop-blur-md border border-cyan-500/40 p-4 rounded-2xl shadow-2xl transition-all duration-300 transform">
                <div class="flex justify-between items-start mb-2">
                    <div class="flex items-center gap-2.5">
                        <span id="info-type-tag" class="px-2 py-0.5 text-[10px] font-bold rounded bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 uppercase tracking-wider">
                            一等星
                        </span>
                        <h2 id="info-title" class="text-lg font-bold text-white tracking-wide glow-text">シリウス</h2>
                        <span id="info-subtitle" class="text-xs text-slate-400 font-mono">(Sirius / α Canis Majoris)</span>
                    </div>
                    <button id="btn-speak" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 hover:text-cyan-300 transition-all border border-slate-700" title="音声解説">
                        <i class="fa-solid fa-volume-high text-sm"></i>
                    </button>
                </div>

                <p id="info-description" class="text-xs text-slate-300 leading-relaxed line-clamp-3 mb-3">
                    おおいぬ座のα星で、全夜空で最も明るい一等星（マイナス1.46等級）。地球から約8.6光年の距離にあり、青白色に輝く美しい恒星です。冬の大三角の頂点の一つ。
                </p>

                <div class="grid grid-cols-3 gap-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-center text-xs">
                    <div>
                        <span class="block text-[10px] text-slate-500 uppercase font-bold">視等級</span>
                        <span id="info-mag" class="font-bold text-amber-300 font-mono">-1.46 mag</span>
                    </div>
                    <div>
                        <span class="block text-[10px] text-slate-500 uppercase font-bold">距離</span>
                        <span id="info-dist" class="font-bold text-cyan-300 font-mono">8.6 光年</span>
                    </div>
                    <div>
                        <span class="block text-[10px] text-slate-500 uppercase font-bold">所属/位置</span>
                        <span id="info-constellation" class="font-bold text-indigo-300 truncate">おおいぬ座</span>
                    </div>
                </div>
            </div>

            <!-- Quick Navigation Shortcuts Bar -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none text-xs">
                <span class="text-[11px] text-slate-400 font-bold whitespace-nowrap px-1"><i class="fa-solid fa-location-crosshairs text-cyan-400 mr-1"></i>注目天体:</span>
                <button class="nav-shortcut flex-shrink-0 bg-slate-900/80 border border-slate-700/80 hover:border-cyan-500/80 text-slate-200 px-3 py-1.5 rounded-xl font-medium transition-all" data-target="Orion">
                    オリオン座 (ベテルギウス)
                </button>
                <button class="nav-shortcut flex-shrink-0 bg-slate-900/80 border border-slate-700/80 hover:border-cyan-500/80 text-slate-200 px-3 py-1.5 rounded-xl font-medium transition-all" data-target="SummerTriangle">
                    夏の大三角 (ベガ)
                </button>
                <button class="nav-shortcut flex-shrink-0 bg-slate-900/80 border border-slate-700/80 hover:border-cyan-500/80 text-slate-200 px-3 py-1.5 rounded-xl font-medium transition-all" data-target="SouthernCross">
                    みなみじゅうじ座
                </button>
                <button class="nav-shortcut flex-shrink-0 bg-slate-900/80 border border-slate-700/80 hover:border-cyan-500/80 text-slate-200 px-3 py-1.5 rounded-xl font-medium transition-all" data-target="Scorpius">
                    さそり座 (アンタレス)
                </button>
                <button class="nav-shortcut flex-shrink-0 bg-slate-900/80 border border-slate-700/80 hover:border-cyan-500/80 text-slate-200 px-3 py-1.5 rounded-xl font-medium transition-all" data-target="UrsaMajor">
                    おおくま座 (北斗七星)
                </button>
            </div>
        </footer>
    </div>

    <!-- Catalog Modal -->
    <div id="catalog-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-lg hidden flex-col justify-end sm:justify-center items-center p-0 sm:p-4 transition-all duration-300">
        <div class="bg-slate-900 border border-slate-700/80 w-full max-w-2xl h-[85vh] sm:h-[80vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/90">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-book-open-reader text-cyan-400 text-lg"></i>
                    <h2 class="text-base font-bold text-white">天体 & 88星座図鑑カタログ</h2>
                </div>
                <button id="btn-close-catalog" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Search & Filter -->
            <div class="p-3 bg-slate-950/50 border-b border-slate-800 flex gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                    <input type="text" id="catalog-search" placeholder="星座名・一等星・キーワードで検索..." class="w-full bg-slate-900 border border-slate-700 text-xs text-white pl-9 pr-3 py-2 rounded-xl focus:outline-none focus:border-cyan-500">
                </div>
                <select id="catalog-filter" class="bg-slate-900 border border-slate-700 text-xs text-slate-300 rounded-xl px-2 focus:outline-none focus:border-cyan-500">
                    <option value="all">すべて</option>
                    <option value="star">一等星・主要恒星</option>
                    <option value="constellation">星座</option>
                    <option value="asterism">大三角・星空アステリズム</option>
                </select>
            </div>

            <!-- Modal Grid Item List -->
            <div id="catalog-list" class="flex-1 overflow-y-auto p-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script>
        // --- 1. CELESTIAL DATASET (EXPANDED MAJOR CONSTELLATIONS & BRIGHT STARS) ---
        // Equatorial coordinates converted to Celestial Sphere positions (RA: hours, Dec: deg)
        // Helper function to turn (RA_h, Dec_deg, Dist_r) into 3D Vector (RA: 0~24h = 0~360deg)
        function raDecToVector(raHours, decDegrees, radius = 500) {
            const raRad = (raHours * 15) * (Math.PI / 180);
            const decRad = decDegrees * (Math.PI / 180);
            return new THREE.Vector3(
                radius * Math.cos(decRad) * Math.cos(raRad),
                radius * Math.sin(decRad),
                radius * Math.cos(decRad) * Math.sin(raRad)
            );
        }

        // Detailed Major Stars Dataset
        const CELESTIAL_STARS = [
            // 冬のダイヤモンド / 冬の大三角
            { id: "sirius", name: "シリウス", nameEn: "Sirius", constellation: "おおいぬ座", ra: 6.75, dec: -16.7, mag: -1.46, dist: "8.6光年", color: 0x9bb0ff, type: "star", desc: "全天で最も明るい一等星。おおいぬ座のα星で、冬の大三角の一角をなす美しい青白色の輝きを持つ恒星です。" },
            { id: "betelgeuse", name: "ベテルギウス", nameEn: "Betelgeuse", constellation: "オリオン座", ra: 5.92, dec: 7.4, mag: 0.5, dist: "640光年", color: 0xffa07a, type: "star", desc: "オリオン座の右肩に輝く赤色超巨星。寿命が近く将来超新星爆発を起こすと予想されています。" },
            { id: "rigel", name: "リゲル", nameEn: "Rigel", constellation: "オリオン座", ra: 5.25, dec: -8.2, mag: 0.13, dist: "860光年", color: 0xbbdaff, type: "star", desc: "オリオン座の左足に位置する青白色の超巨星。非常に強烈な光を放っています。" },
            { id: "procyon", name: "プロキオン", nameEn: "Procyon", constellation: "こいぬ座", ra: 7.65, dec: 5.2, mag: 0.38, dist: "11.4光年", color: 0xfff4ea, type: "star", desc: "こいぬ座のα星。シリウス、ベテルギウスとともに「冬の大三角」を形成します。" },
            { id: "aldebaran", name: "アルデバラン", nameEn: "Aldebaran", constellation: "おうし座", ra: 4.6, dec: 16.5, mag: 0.85, dist: "65光年", color: 0xffaa66, type: "star", desc: "おうし座の鋭い赤い眼として輝く橙色巨星。「追うもの」という意味のプレアデス星団の後を追う星です。" },
            { id: "pollux", name: "ポルックス", nameEn: "Pollux", constellation: "ふたご座", ra: 7.75, dec: 28.0, mag: 1.14, dist: "34光年", color: 0xffddaa, type: "star", desc: "ふたご座の弟星とされる1等星。オレンジ色に輝く巨大な恒星です。" },
            { id: "castor", name: "カストル", nameEn: "Castor", constellation: "ふたご座", ra: 7.57, dec: 31.9, mag: 1.58, dist: "51光年", color: 0xddeeff, type: "star", desc: "ふたご座の兄星。実際には6つの星からなる複雑な多重星系です。" },
            { id: "capella", name: "カペラ", nameEn: "Capella", constellation: "ぎょしゃ座", ra: 5.28, dec: 46.0, mag: 0.08, dist: "43光年", color: 0xfff2a3, type: "star", desc: "ぎょしゃ座で最も明るい黄色い1等星。北天で非常に目立つ恒星です。" },

            // 夏の大三角
            { id: "vega", name: "ベガ (織姫星)", nameEn: "Vega", constellation: "こと座", ra: 18.62, dec: 38.78, mag: 0.03, dist: "25光年", color: 0xaaccff, type: "star", desc: "こと座の1等星で七夕の「織姫星」。夏の大三角の中で最も明るく青真っ白に輝きます。" },
            { id: "altair", name: "アルタイル (彦星)", nameEn: "Altair", constellation: "わし座", ra: 19.84, dec: 8.87, mag: 0.77, dist: "16.7光年", color: 0xddf0ff, type: "star", desc: "わし座の1等星で七夕の「彦星」。非常に高速で自転していることで知られます。" },
            { id: "deneb", name: "デネブ", nameEn: "Deneb", constellation: "はくちょう座", ra: 20.69, dec: 45.28, mag: 1.25, dist: "2600光年", color: 0xe0f0ff, type: "star", desc: "はくちょう座の尾に輝く白超巨星。超遠距離にありながら1等星として強烈に輝く超高出力な恒星です。" },

            // 春の大三角 / 秋 / 南天
            { id: "spica", name: "スピカ", nameEn: "Spica", constellation: "おとめ座", ra: 13.42, dec: -11.16, mag: 0.98, dist: "250光年", color: 0x88ccff, type: "star", desc: "おとめ座の青白色の1等星。「真珠星」とも呼ばれる清らかな光を放ちます。" },
            { id: "arcturus", name: "アルクトゥルス", nameEn: "Arcturus", constellation: "うしかい座", ra: 14.26, dec: 19.18, mag: -0.05, dist: "37光年", color: 0xffb366, type: "star", desc: "うしかい座のオレンジ色の1等星。麦刈りの季節に昇るため「麦星」とも親しまれます。" },
            { id: "regulus", name: "レグルス", nameEn: "Regulus", constellation: "しし座", ra: 10.14, dec: 11.97, mag: 1.36, dist: "79光年", color: 0xb3d9ff, type: "star", desc: "しし座の心臓部に輝く青白色の1等星。「小さな王」を意味する名を持ちます。" },
            { id: "antares", name: "アンタレス", nameEn: "Antares", constellation: "さそり座", ra: 16.48, dec: -26.43, mag: 1.06, dist: "550光年", color: 0xff4500, type: "star", desc: "さそり座の胸元で不気味なほど赤く光る超巨星。「火星に対抗するもの」の意味をもちます。" },
            { id: "fomalhaut", name: "フォーマルハウト", nameEn: "Fomalhaut", constellation: "みなみのうお座", ra: 22.96, dec: -29.62, mag: 1.17, dist: "25光年", color: 0xddeeff, type: "star", desc: "秋の夜空にポツンと寂しく輝く1等星。「南のひとつ星」と呼ばれます。" },
            { id: "acrux", name: "アクルックス", nameEn: "Acrux", constellation: "みなみじゅうじ座", ra: 12.44, dec: -63.1, mag: 0.77, dist: "320光年", color: 0xaabbff, type: "star", desc: "南十字星（みなみじゅうじ座）の最南端に位置する最輝星。" }
        ];

        // Constellations with Star Connectivity Lines (RA in hours, Dec in deg)
        const CONSTELLATIONS = [
            {
                id: "Orion", name: "オリオン座", nameEn: "Orion", ra: 5.5, dec: 0, type: "constellation",
                desc: "冬の夜空を代表する最も有名な星座。三ツ星を取り囲む豪華な1等星ベテルギウスとリゲルが特徴的です。",
                lines: [
                    [{ra:5.92, dec:7.4}, {ra:5.41, dec:6.3}], // Betelgeuse -> Bellatrix
                    [{ra:5.41, dec:6.3}, {ra:5.24, dec:-0.3}], // Bellatrix -> Mintaka
                    [{ra:5.24, dec:-0.3}, {ra:5.6, dec:-9.6}], // Mintaka -> Saiph
                    [{ra:5.6, dec:-9.6}, {ra:5.25, dec:-8.2}], // Saiph -> Rigel
                    [{ra:5.25, dec:-8.2}, {ra:5.6, dec:-1.9}], // Rigel -> Alnitak
                    [{ra:5.6, dec:-1.9}, {ra:5.92, dec:7.4}], // Alnitak -> Betelgeuse
                    [{ra:5.24, dec:-0.3}, {ra:5.36, dec:-1.2}], // Belt Mintaka -> Alnilam
                    [{ra:5.36, dec:-1.2}, {ra:5.6, dec:-1.9}]  // Belt Alnilam -> Alnitak
                ]
            },
            {
                id: "SummerTriangle", name: "夏の大三角", nameEn: "Summer Triangle", ra: 19.8, dec: 30, type: "asterism",
                desc: "こと座のベガ、わし座のアルタイル、はくちょう座のデネブを結んで描かれる夏の夜空の大ランドマーク。",
                lines: [
                    [{ra:18.62, dec:38.78}, {ra:19.84, dec:8.87}], // Vega -> Altair
                    [{ra:19.84, dec:8.87}, {ra:20.69, dec:45.28}], // Altair -> Deneb
                    [{ra:20.69, dec:45.28}, {ra:18.62, dec:38.78}] // Deneb -> Vega
                ]
            },
            {
                id: "Cygnus", name: "はくちょう座", nameEn: "Cygnus (Northern Cross)", ra: 20.5, dec: 42, type: "constellation",
                desc: "天の川の上に大きな十字を描く「北十字星」。デネブを尾に持ち、羽を広げて飛ぶ白鳥の姿を映します。",
                lines: [

        function initThreeScene() {
            const container = document.getElementById('canvas-container');

            // Populate Ambient Background Stars ( thousands of faint stars )

        // Ambient Faint Star Background
        function createAmbientBackgroundStars() {
            const starCount = 2500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount; i++) {
                // Random celestial spherical distribution
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 550;

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                // Subtle variations in star temperature tints
                const colorChoice = Math.random();
                if (colorChoice > 0.85) {
                    colors[i * 3] = 0.6; colors[i * 3 + 1] = 0.8; colors[i * 3 + 2] = 1.0; // Blueish
                } else if (colorChoice > 0.70) {
                    colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.8; colors[i * 3 + 2] = 0.5; // Orange/Yellow
                } else {
                    colors[i * 3] = 0.9; colors[i * 3 + 1] = 0.95; colors[i * 3 + 2] = 1.0; // White
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 2.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });

            const points = new THREE.Points(geometry, material);
            starFieldGroup.add(points);
        }

        // Create Major Named Stars with 3D Visual Mesh
        function createMajorStars() {
            CELESTIAL_STARS.forEach(star => {
                const vec = raDecToVector(star.ra, star.dec, 500);

                // Star core mesh
                const starGeo = new THREE.SphereGeometry(star.mag < 0 ? 5.5 : 4.0, 16, 16);
                const starMat = new THREE.MeshBasicMaterial({ color: star.color });
                const starMesh = new THREE.Mesh(starGeo, starMat);
                starMesh.position.copy(vec);
                starMesh.userData = star;
                starFieldGroup.add(starMesh);

                // Halo Glow effect
                const canvas = document.createElement('canvas');
                canvas.width = 64; canvas.height = 64;
                const ctx = canvas.getContext('2d');
                const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.3, '#' + star.color.toString(16).padStart(6, '0'));
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 64, 64);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(30, 30, 1);
                sprite.position.copy(vec);
                starFieldGroup.add(sprite);
            });
        }

        // Render Constellation Line Segments
        function createConstellationLines() {
            CONSTELLATIONS.forEach(constell => {
                constell.lines.forEach(linePair => {
                    const p1 = raDecToVector(linePair[0].ra, linePair[0].dec, 495);
                    const p2 = raDecToVector(linePair[1].ra, linePair[1].dec, 495);

                    const lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                    const lineMat = new THREE.LineBasicMaterial({
                        color: constell.type === "asterism" ? 0x38bdf8 : 0x818cf8,
                        transparent: true,
                        opacity: constell.type === "asterism" ? 0.8 : 0.45,
                        linewidth: 1.5
                    });

                    const line = new THREE.Line(lineGeo, lineMat);
                    constellationLinesGroup.add(line);
                });
            });
        }

        // --- 3. REALTIME RETICLE LOCK & TARGET CALCULATION ---
        let lockedTarget = null;
        let lastHapticTime = 0;

        function updateReticleTargetLock() {
            // Get center direction vector of current view
            const centerVec = new THREE.Vector3(0, 0, -1);
            centerVec.applyQuaternion(camera.quaternion);

            let closestTarget = null;
            let minAngleDeg = Infinity;

            // Calculate angular distance to all dataset stars & constellations
            ALL_TARGETS.forEach(target => {
                const targetNorm = target.vec.clone().normalize();
                const dot = centerVec.dot(targetNorm);
                // Clamp dot product
                const clampedDot = Math.max(-1, Math.min(1, dot));
                const angleRad = Math.acos(clampedDot);
                const angleDeg = angleRad * (180 / Math.PI);

                if (angleDeg < minAngleDeg) {
                    minAngleDeg = angleDeg;
                    closestTarget = target;
                }
            });

            // Reticle lock threshold (e.g. within 12 degrees of center)
            const lockBadge = document.getElementById('center-lock-badge');
            const targetNameEl = document.getElementById('center-target-name');
            const targetSubEl = document.getElementById('center-target-sub');
            const targetDistEl = document.getElementById('center-target-dist');

            if (closestTarget && minAngleDeg <= 12.0) {
                targetNameEl.textContent = closestTarget.name;
                targetSubEl.textContent = `(${closestTarget.nameEn || closestTarget.constellation})`;
                targetDistEl.textContent = `${minAngleDeg.toFixed(1)}°`;

                if (lockedTarget?.id !== closestTarget.id) {
                    lockedTarget = closestTarget;
                    // Trigger dynamic info card update
                    updateInfoCard(closestTarget);

                    // Optional haptic rumble on lock
                    if (navigator.vibrate && Date.now() - lastHapticTime > 800) {
                        navigator.vibrate(25);
                        lastHapticTime = Date.now();
                    }
                }

                lockBadge.classList.remove('opacity-40', 'border-slate-700');
                lockBadge.classList.add('border-amber-500/80', 'bg-slate-900/95');
            } else {
                targetNameEl.textContent = "天体探索中...";
                targetSubEl.textContent = "レティクルを近づけてください";
                targetDistEl.textContent = minAngleDeg < 90 ? `${minAngleDeg.toFixed(1)}°` : "--";
                
                lockBadge.classList.add('opacity-40', 'border-slate-700');
                lockBadge.classList.remove('border-amber-500/80', 'bg-slate-900/95');
            }
        }

        function updateInfoCard(target) {
            document.getElementById('info-title').textContent = target.name;
            document.getElementById('info-subtitle').textContent = `(${target.nameEn || target.id})`;
            document.getElementById('info-description').textContent = target.desc;
            document.getElementById('info-mag').textContent = target.mag !== undefined ? `${target.mag} mag` : 'パターン';
            document.getElementById('info-dist').textContent = target.dist || '遠方';
            document.getElementById('info-constellation').textContent = target.constellation || target.name;

            const tagEl = document.getElementById('info-type-tag');
            if (target.type === 'star') {
                tagEl.textContent = '一等星・主要恒星';
                tagEl.className = 'px-2 py-0.5 text-[10px] font-bold rounded bg-amber-500/20 border border-amber-400/40 text-amber-300 uppercase tracking-wider';
            } else if (target.type === 'asterism') {
                tagEl.textContent = '大三角/アステリズム';
                tagEl.className = 'px-2 py-0.5 text-[10px] font-bold rounded bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 uppercase tracking-wider';
            } else {

                tagEl.className = 'px-2 py-0.5 text-[10px] font-bold rounded bg-indigo-500/20 border border-indigo-400/40 text-indigo-300 uppercase tracking-wider';
            }
        }

        // --- 4. GYRO SENSOR & INTERACTION HANDLERS ---
        function initSensorControls() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleOrientation, false);
            }

            // Touch / Mouse Drag Controls Setup
            const container = document.getElementById('canvas-container');

            const startDrag = (x, y) => {
                isDragging = true;
                previousTouchPos = { x, y };
            };

            const moveDrag = (x, y) => {
                if (!isDragging) return;
                const deltaX = x - previousTouchPos.x;
                const deltaY = y - previousTouchPos.y;

                targetYaw -= deltaX * 0.004;
                targetPitch += deltaY * 0.004;

                // Clamp pitch so camera doesn't flip upside down
                targetPitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, targetPitch));

                previousTouchPos = { x, y };
            };

            const endDrag = () => { isDragging = false; };

            // Mouse listeners
            container.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
            window.addEventListener('mouseup', endDrag);

            // Touch listeners
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
            });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            });
            window.addEventListener('touchend', endDrag);
        }

        function handleOrientation(event) {
            if (event.alpha === null || event.beta === null) return;
            hasGyroSupport = true;
            document.getElementById('sensor-banner').style.display = 'none';

            // Convert Euler angles (alpha, beta, gamma) from device to scene rotation
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;

            targetYaw = alpha;
            targetPitch = beta - Math.PI / 2;
        }

        // Request Gyro Permissions on iOS 13+
        document.getElementById('btn-request-gyro').addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, false);
                        }
                    })
                    .catch(console.error);
            }
        });

        // AR Mode Toggle
        document.getElementById('btn-ar-toggle').addEventListener('click', async () => {
            const videoEl = document.getElementById('ar-video');
            const arBtnLabel = document.getElementById('ar-btn-label');

            if (!isARActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    videoEl.srcObject = stream;
                    videoEl.classList.remove('hidden');
                    isARActive = true;
                    arBtnLabel.textContent = 'AR: ON';
                } catch (err) {
                    alert('カメラへのアクセスが拒否されたか、対応していません。');
                }
            } else {
                if (videoEl.srcObject) {
                    videoEl.srcObject.getTracks().forEach(track => track.stop());
                }
                videoEl.classList.add('hidden');
                isARActive = false;
                arBtnLabel.textContent = 'AR: OFF';
            }
        });

        // Speech Synthesis Text-To-Speech
        document.getElementById('btn-speak').addEventListener('click', () => {
            if (!('speechSynthesis' in window)) return;

            const name = document.getElementById('info-title').textContent;
            const desc = document.getElementById('info-description').textContent;
            const textToSpeak = `${name}。${desc}`;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);

        document.querySelectorAll('.nav-shortcut').forEach(btn => {
            btn.addEventListener('click', (e) => {

                if (found) {

                    const raRad = (found.ra * 15) * (Math.PI / 180);
                    const decRad = found.dec * (Math.PI / 180);

                    targetYaw = raRad;
                    targetPitch = decRad;
                }
            });
        });

        // --- 5. CATALOG MODAL SYSTEM ---
        function initCatalogModal() {
            const modal = document.getElementById('catalog-modal');
            const btnOpen = document.getElementById('btn-catalog');
            const btnClose = document.getElementById('btn-close-catalog');
            const listContainer = document.getElementById('catalog-list');
            const searchInput = document.getElementById('catalog-search');
            const filterSelect = document.getElementById('catalog-filter');

            btnOpen.addEventListener('click', () => {
                renderCatalogItems();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            });

            btnClose.addEventListener('click', () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            });

            const renderCatalogItems = () => {
                const query = searchInput.value.toLowerCase();
                const filter = filterSelect.value;

                listContainer.innerHTML = '';

                const filtered = ALL_TARGETS.filter(item => {
                    const matchesQuery = item.name.toLowerCase().includes(query) || (item.nameEn && item.nameEn.toLowerCase().includes(query));
                    const matchesType = filter === 'all' || item.type === filter;
                    return matchesQuery && matchesType;
                });

                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-950/80 border border-slate-800 hover:border-cyan-500/50 p-3 rounded-2xl flex flex-col justify-between cursor-pointer transition-all hover:bg-slate-900';
                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-cyan-300 border border-slate-700">
                                    ${item.type === 'star' ? '1等星' : item.type === 'asterism' ? '大三角' : '星座'}
                                </span>
                                <span class="text-xs text-slate-500 font-mono">${item.dist || ''}</span>
                            </div>
                            <h3 class="text-sm font-bold text-white mb-1">${item.name} <span class="text-xs text-slate-400 font-normal">(${item.nameEn || ''})</span></h3>
                            <p class="text-xs text-slate-400 line-clamp-2">${item.desc}</p>
                        </div>
                        <button class="mt-3 text-xs font-medium text-cyan-400 hover:text-cyan-300 flex items-center justify-end gap-1">
                            照準を合わせる <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    `;

                    card.addEventListener('click', () => {
                        const raRad = (item.ra * 15) * (Math.PI / 180);
                        const decRad = item.dec * (Math.PI / 180);
                        targetYaw = raRad;
                        targetPitch = decRad;

                        modal.classList.add('hidden');
                        modal.classList.remove('flex');
                    });

                    listContainer.appendChild(card);
                });
            };

            searchInput.addEventListener('input', renderCatalogItems);
            filterSelect.addEventListener('change', renderCatalogItems);
        }

        // --- 6. MAIN RENDER & ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Smooth Interpolation (LERP) for Camera Orientation
            currentYaw += (targetYaw - currentYaw) * 0.08;
            currentPitch += (targetPitch - currentPitch) * 0.08;

            // Apply orientation via Euler order YXZ
            const euler = new THREE.Euler(currentPitch, currentYaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            // Update Header Telemetry Status (Azimuth & Altitude)
            const azDeg = Math.round(((currentYaw * 180 / Math.PI) % 360 + 360) % 360);
            const altDeg = Math.round(currentPitch * 180 / Math.PI);
            document.getElementById('azimuth-val').textContent = `${azDeg.toString().padStart(3, '0')}°`;
            document.getElementById('altitude-val').textContent = `${altDeg >= 0 ? '+' : ''}${altDeg}°`;

            // Calculate Reticle Distance to Stars & Update Target Lock Indicator
            updateReticleTargetLock();

            // Render 3D Scene
            renderer.render(scene, camera);
        }

        // Window Load Handler
        window.onload = function() {
            initThreeScene();
            initSensorControls();
            initCatalogModal();

            // Set initial camera view toward Orion / Sirius region
            targetYaw = (5.5 * 15) * (Math.PI / 180);
            targetPitch = -0.1;

            // Start loop
            animate();
        };
    </script>
</body>
</html>
