<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Celestial Navigator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap');

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* Glassmorphism Panel Styling */
    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.1);
    }

    .glass-button {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
    }

    .glass-button:active, .glass-button.active {
      transform: scale(0.95);
      background: rgba(56, 189, 248, 0.35);
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    /* Pulse Ring Animation for Reticle Center */
    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.85); opacity: 0.8; }
    }

    .reticle-ring {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }

    /* Navigation Arrow Bounce */
    @keyframes arrow-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .nav-arrow-anim {
      animation: arrow-bounce 1s infinite ease-in-out;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: #38bdf8;
      border-radius: 4px;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative overflow-hidden">

  <!-- Background Layer 1: Real Camera Feed -->
  <video id="cameraFeed" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0 hidden"></video>

  <!-- Background Layer 2: 3D Sky Canvas -->
  <canvas id="skyCanvas" class="absolute inset-0 w-full h-full z-1"></canvas>

  <!-- HUD Overlay UI (Z-Index 10) -->
  <div id="hudOverlay" class="absolute inset-0 z-10 flex flex-col justify-between p-3 sm:p-4 pointer-events-none">
    
    <!-- Top Bar: Compass, GPS Stats, Controls -->
    <div class="flex justify-between items-start gap-2">
      <!-- Compass HUD & GPS Info -->
      <div class="glass-panel rounded-2xl p-2.5 flex items-center space-x-3 pointer-events-auto">
        <div class="relative w-9 h-9 flex items-center justify-center border-2 border-cyan-400 rounded-full bg-slate-900/50">
          <i id="compassNeedle" class="fa-solid fa-location-arrow text-cyan-400 text-base transition-transform duration-100"></i>
        </div>
        <div>
          <div class="text-xs text-cyan-300 font-orbitron flex items-center gap-1">
            <span>HDG:</span> <span id="headingVal" class="font-bold text-white">000° N</span>
          </div>
          <div class="text-[10px] text-gray-400 font-orbitron">
            ALT: <span id="pitchVal">0°</span> | LAT: <span id="latVal">31.6°N</span>
          </div>
        </div>
      </div>

      <!-- Settings & Mode Controls -->
      <div class="flex items-center space-x-1.5 pointer-events-auto">
        <button id="toggleAudioBtn" class="glass-button w-9 h-9 rounded-full text-cyan-400 flex items-center justify-center" title="音声を切替">
          <i class="fa-solid fa-volume-high text-xs"></i>
        </button>
        <button id="toggleVibeBtn" class="glass-button w-9 h-9 rounded-full text-cyan-400 flex items-center justify-center" title="振動を切替">
          <i class="fa-solid fa-mobile-screen-button text-xs"></i>
        </button>
        <button id="toggleCamBtn" class="glass-button w-9 h-9 rounded-full text-cyan-400 flex items-center justify-center" title="カメラ背景を切替">
          <i class="fa-solid fa-camera text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Center Screen Target Lock Reticle -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
      <div class="relative w-28 h-28 flex items-center justify-center">
        <!-- Reticle Inner Pulse Ring -->
        <div class="absolute inset-3 border-2 border-cyan-400/60 rounded-full reticle-ring"></div>
        
        <!-- Center Reticle Aiming Dot -->
        <div id="reticleDot" class="w-3.5 h-3.5 bg-cyan-400 rounded-full shadow-[0_0_12px_#38bdf8] transition-all duration-200"></div>

        <!-- Corner Frame Markers -->
        <div class="absolute top-0 left-0 w-3.5 h-3.5 border-t-2 border-l-2 border-cyan-400"></div>
        <div class="absolute top-0 right-0 w-3.5 h-3.5 border-t-2 border-r-2 border-cyan-400"></div>
        <div class="absolute bottom-0 left-0 w-3.5 h-3.5 border-b-2 border-l-2 border-cyan-400"></div>
        <div class="absolute bottom-0 right-0 w-3.5 h-3.5 border-b-2 border-r-2 border-cyan-400"></div>

        <!-- Dynamic Real-time Target Badge -->
        <div id="reticleBadge" class="absolute -top-10 px-3 py-1 bg-slate-900/90 border border-cyan-400/60 rounded-full opacity-0 transition-opacity duration-200 flex items-center space-x-1.5 whitespace-nowrap shadow-lg">
          <span id="reticleBadgeDot" class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
          <span id="reticleBadgeText" class="text-xs font-bold text-cyan-200 font-orbitron">TARGET LOCKED</span>
        </div>
      </div>
    </div>

    <!-- Middle Hunter Navigation Radar Bar -->
    <div class="flex flex-col items-center justify-center space-y-2 my-auto">
      <div id="radarContainer" class="glass-panel px-4 py-2 rounded-full hidden flex items-center space-x-3 pointer-events-auto">
        <div id="navArrow" class="text-rose-400 text-lg nav-arrow-anim transition-transform duration-200">
          <i class="fa-solid fa-circle-chevron-up"></i>
        </div>
        <div class="flex flex-col">
          <span class="text-[10px] font-orbitron text-gray-400">NAV TARGET</span>
          <span id="targetName" class="text-xs font-orbitron font-bold text-rose-300">SUN (太陽)</span>
        </div>
        <div class="w-16 bg-gray-700 h-2 rounded-full overflow-hidden">
          <div id="radarBar" class="bg-gradient-to-r from-cyan-400 to-rose-500 h-full w-0 transition-all duration-150"></div>
        </div>
        <span id="targetDist" class="text-xs font-orbitron text-cyan-400">0°</span>
      </div>
    </div>

    <!-- Bottom Info Panel & Navigation Controls -->
    <div class="flex flex-col space-y-2 pointer-events-auto">
      
      <!-- Celestial Information Card -->
      <div id="infoCard" class="glass-panel rounded-2xl p-3.5 transition-all duration-300 transform translate-y-4 opacity-0 max-h-44 overflow-y-auto">
        <div class="flex justify-between items-start mb-1">
          <div>
            <span id="objectCategory" class="text-[10px] font-orbitron uppercase text-cyan-400 tracking-wider">CONSTELLATION</span>
            <h2 id="objectTitle" class="text-lg font-bold text-white flex items-center gap-2">
              オリオン座 <span id="objectEn" class="text-xs text-gray-400 font-orbitron font-normal">(Orion)</span>
            </h2>
          </div>
          <span id="coordBadge" class="bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 text-[10px] font-orbitron px-2 py-0.5 rounded-full">
            ALT: 45° / AZ: 180°
          </span>
        </div>
        <p id="objectLore" class="text-xs text-gray-300 leading-relaxed font-light">
          画面中央に星座の中心や星を向けると、星座名や詳細情報がリアルタイムで表示されます。
        </p>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="grid grid-cols-3 gap-1.5">
        <button id="modeGuideBtn" class="glass-button py-2.5 rounded-xl text-xs font-bold text-cyan-300 flex items-center justify-center space-x-1 active">
          <i class="fa-solid fa-compass"></i>
          <span>ガイド</span>
        </button>
        <button id="modeHunterBtn" class="glass-button py-2.5 rounded-xl text-xs font-bold text-cyan-300 flex items-center justify-center space-x-1">
          <i class="fa-solid fa-crosshairs"></i>
          <span>ナビ</span>
        </button>
        <button id="modeCatalogBtn" class="glass-button py-2.5 rounded-xl text-xs font-bold text-cyan-300 flex items-center justify-center space-x-1">
          <i class="fa-solid fa-list-ul"></i>
          <span>天体図鑑</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Celestial Catalog Modal Overlay -->
  <div id="catalogModal" class="absolute inset-0 z-40 bg-slate-950/90 backdrop-blur-md hidden flex flex-col p-4 pt-12">
    <div class="flex justify-between items-center mb-3 pb-2 border-b border-cyan-500/30">
      <h2 class="text-lg font-bold font-orbitron text-cyan-300 flex items-center gap-2">
        <i class="fa-solid fa-book-atlas"></i> 天体・88星座カタログ
      </h2>
      <button id="closeCatalogBtn" class="text-gray-400 hover:text-white text-xl p-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Search Input Filter -->
    <div class="mb-3">
      <input id="catalogSearch" type="text" placeholder="星や星座を検索 (例: オリオン, 火星, シリウス)" class="w-full bg-slate-900 border border-cyan-500/40 rounded-xl px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400" />
    </div>
    
    <div id="catalogList" class="flex-1 overflow-y-auto space-y-2 pr-1">
      <!-- Dynamic Catalog Items -->
    </div>
  </div>

  <!-- Start Permission / Setup Modal -->
  <div id="permissionModal" class="absolute inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 bg-cyan-500/10 border border-cyan-400/40 rounded-full flex items-center justify-center mb-4 text-cyan-400 text-2xl animate-pulse">
      <i class="fa-solid fa-location-crosshairs text-cyan-400"></i>
    </div>
    <h1 class="text-xl font-extrabold font-orbitron text-white mb-1 tracking-wide">AR CELESTIAL NAVIGATOR</h1>
    <p class="text-[11px] text-cyan-300/80 mb-4 font-orbitron">リアルタイム天体・88星座ARトラッカー</p>
    
    <div class="text-xs text-gray-300 max-w-xs space-y-2.5 mb-6 text-left bg-slate-900/80 p-3.5 rounded-xl border border-slate-800">
      <div class="flex items-start space-x-2.5">
        <i class="fa-solid fa-crosshairs text-cyan-400 mt-0.5"></i>
        <span><strong>画面中央ロックオン:</strong> スマホをかざすと中央のレティクルが星座や星を自動補獲。</span>
      </div>
      <div class="flex items-start space-x-2.5">
        <i class="fa-solid fa-compass text-cyan-400 mt-0.5"></i>
        <span><strong>リアルタイム方位計算:</strong> 緯度経度・現在時刻に基づき正確な天体位置を描画。</span>
      </div>
    </div>

    <button id="startSensorsBtn" class="w-full max-w-xs py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/20 font-orbitron tracking-wider text-xs transition-transform active:scale-95">
      START AR EXPERIENCE
    </button>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    const observer = {
      lat: 31.59,
      lon: 130.55
    };

    function getJulianDate(date = new Date()) {
      return (date.getTime() / 86400000) + 2440587.5;
    }

    function getLocalSiderealTime(date = new Date(), lonDeg = observer.lon) {
      const jd = getJulianDate(date);
      const d = jd - 2451545.0;
      let gmst = 18.697374558 + 24.06570982441908 * d;
      gmst = gmst % 24;
      if (gmst < 0) gmst += 24;
      let lst = gmst + (lonDeg / 15.0);
      lst = lst % 24;
      if (lst < 0) lst += 24;
      return lst * 15.0;
    }

    function raDecToAltAz(ra, dec, date = new Date()) {
      const lst = getLocalSiderealTime(date, observer.lon);
      const ha = (lst - ra + 360) % 360;
      
      const haRad = THREE.MathUtils.degToRad(ha);
      const decRad = THREE.MathUtils.degToRad(dec);
      const latRad = THREE.MathUtils.degToRad(observer.lat);

      const sinAlt = Math.sin(decRad) * Math.sin(latRad) + Math.cos(decRad) * Math.cos(latRad) * Math.cos(haRad);
      const altRad = Math.asin(sinAlt);
      const alt = THREE.MathUtils.radToDeg(altRad);

      const cosAz = (Math.sin(decRad) - Math.sin(latRad) * Math.sin(altRad)) / (Math.cos(latRad) * Math.cos(altRad));
      let azRad = Math.acos(Math.min(Math.max(cosAz, -1), 1));
      if (Math.sin(haRad) > 0) azRad = 2 * Math.PI - azRad;
      const az = THREE.MathUtils.radToDeg(azRad);

      return { alt, az };
    }

    function computeCelestialPositions(date = new Date()) {
      const d = getJulianDate(date) - 2451545.0;
      const L_sun = (280.466 + 0.9856474 * d) % 360;
      const g_sun = THREE.MathUtils.degToRad((357.528 + 0.9856003 * d) % 360);
      const sunEclipticLong = THREE.MathUtils.degToRad(L_sun + 1.915 * Math.sin(g_sun) + 0.020 * Math.sin(2 * g_sun));
      const obl = THREE.MathUtils.degToRad(23.439 - 0.0000004 * d);
      
      const sunRA = THREE.MathUtils.radToDeg(Math.atan2(Math.cos(obl) * Math.sin(sunEclipticLong), Math.cos(sunEclipticLong)));
      const sunDec = THREE.MathUtils.radToDeg(Math.asin(Math.sin(obl) * Math.sin(sunEclipticLong)));

      const L_moon = (218.316 + 13.176396 * d) % 360;
      const M_moon = THREE.MathUtils.degToRad((134.963 + 13.064993 * d) % 360);
      const F_moon = THREE.MathUtils.degToRad((93.272 + 13.229350 * d) % 360);
      const moonLong = THREE.MathUtils.degToRad(L_moon + 6.289 * Math.sin(M_moon));
      const moonLat = THREE.MathUtils.degToRad(5.128 * Math.sin(F_moon));
      
      const moonRA = THREE.MathUtils.radToDeg(Math.atan2(Math.sin(moonLong) * Math.cos(obl) - Math.tan(moonLat) * Math.sin(obl), Math.cos(moonLong)));
      const moonDec = THREE.MathUtils.radToDeg(Math.asin(Math.sin(moonLat) * Math.cos(obl) + Math.cos(moonLat) * Math.sin(obl) * Math.sin(moonLong)));

      return [
        { id: "sun", nameJa: "太陽", nameEn: "Sun", ra: sunRA, dec: sunDec, category: "Star (恒星)", lore: "太陽系の中心に位置する巨大なプラズマの球体。" },
        { id: "moon", nameJa: "月", nameEn: "Moon", ra: moonRA, dec: moonDec, category: "Satellite (衛星)", lore: "地球唯一の天然衛星。" },
        { id: "mercury", nameJa: "水星", nameEn: "Mercury", meanLong: 252.25 + 4.092334 * d, category: "Planet (水星)", lore: "太陽に最も近い極小の惑星。" },
        { id: "venus", nameJa: "金星", nameEn: "Venus", meanLong: 181.98 + 1.602130 * d, category: "Planet (金星)", lore: "最も明るく輝く灼熱の惑星。" },
        { id: "mars", nameJa: "火星", nameEn: "Mars", meanLong: 355.43 + 0.524033 * d, category: "Planet (火星)", lore: "酸化鉄に覆われた赤い表面を持つ惑星。" },
        { id: "jupiter", nameJa: "木星", nameEn: "Jupiter", meanLong: 34.35 + 0.083085 * d, category: "Planet (木星)", lore: "太陽系最大のガス巨大惑星。" },
        { id: "saturn", nameJa: "土星", nameEn: "Saturn", meanLong: 50.08 + 0.033460 * d, category: "Planet (土星)", lore: "美しい環を持つ巨大ガス惑星。" }
      ].map(b => {
        if (b.ra === undefined) {
          const lRad = THREE.MathUtils.degToRad(b.meanLong % 360);
          b.ra = THREE.MathUtils.radToDeg(Math.atan2(Math.sin(lRad) * Math.cos(obl), Math.cos(lRad)));
          b.dec = THREE.MathUtils.radToDeg(Math.asin(Math.sin(obl) * Math.sin(lRad)));
        }
        return b;
      });
    }

    const MAJOR_STARS = [
      { id: "sirius", nameJa: "シリウス", nameEn: "Sirius", ra: 101.28, dec: -16.71, category: "1st Mag Star (おおいぬ座)", lore: "全天で最も明るい恒星。" },
      { id: "vega", nameJa: "ベガ", nameEn: "Vega", ra: 279.23, dec: 38.78, category: "1st Mag Star (こと座)", lore: "七夕の織姫星として知られる青白い一等星。" },
      { id: "altair", nameJa: "アルタイル", nameEn: "Altair", ra: 297.70, dec: 8.87, category: "1st Mag Star (わし座)", lore: "夏の大三角を形作る彦星。" },
      { id: "deneb", nameJa: "デネブ", nameEn: "Deneb", ra: 310.36, dec: 45.28, category: "1st Mag Star (はくちょう座)", lore: "白鳥の尾に光る巨星。" },
      { id: "betelgeuse", nameJa: "ベテルギウス", nameEn: "Betelgeuse", ra: 88.79, dec: 7.41, category: "1st Mag Star (オリオン座)", lore: "オリオン座の赤色超巨星。" },
      { id: "rigel", nameJa: "リゲル", nameEn: "Rigel", ra: 78.63, dec: -8.20, category: "1st Mag Star (オリオン座)", lore: "オリオン座の足元で青白く輝く超巨星。" },
      { id: "polaris", nameJa: "ポラリス (北極星)", nameEn: "Polaris", ra: 37.95, dec: 89.26, category: "North Star (こぐま座)", lore: "真北の空で動かない道しるべ。" },
      { id: "arcturus", nameJa: "アルクトゥルス", nameEn: "Arcturus", ra: 213.91, dec: 19.18, category: "1st Mag Star (うしかい座)", lore: "オレンジ色に輝く一等星。" },
      { id: "spica", nameJa: "スピカ", nameEn: "Spica", ra: 201.30, dec: -11.16, category: "1st Mag Star (おとめ座)", lore: "真珠のように白く輝く主星。" },
      { id: "antares", nameJa: "アンタレス", nameEn: "Antares", ra: 247.35, dec: -26.43, category: "1st Mag Star (さそり座)", lore: "さそりの心臓部に位置する赤い超巨星。" }
    ];

    const CONSTELLATIONS = [
      {
        id: "orion", nameJa: "オリオン座", nameEn: "Orion", category: "Constellation",
        lore: "冬の夜空に君臨する狩人の姿。三ツ星とベテルギウス・リゲルが目印。",
        stars: [
          { name: "ベテルギウス", ra: 88.79, dec: 7.41 },
          { name: "リゲル", ra: 78.63, dec: -8.20 },
          { name: "ベラトリックス", ra: 81.28, dec: 6.35 },
          { name: "サイフ", ra: 86.93, dec: -9.66 },
          { name: "アルニタク", ra: 85.19, dec: -1.94 },
          { name: "アルニラム", ra: 84.05, dec: -1.20 },
          { name: "ミンタカ", ra: 83.00, dec: -0.30 }
        ],
        edges: [[0, 2], [2, 6], [6, 5], [5, 4], [4, 0], [4, 1], [6, 3], [5, 3]]
      },
      {
        id: "cygnus", nameJa: "はくちょう座", nameEn: "Cygnus", category: "Constellation",
        lore: "天の川の上に大きな十字を描く「北十字」。",
        stars: [
          { name: "デネブ", ra: 310.36, dec: 45.28 },
          { name: "アルビレオ", ra: 292.68, dec: 27.96 },
          { name: "サドル", ra: 305.55, dec: 40.25 },
          { name: "ギナー", ra: 312.01, dec: 33.97 },
          { name: "ルフ", ra: 296.24, dec: 45.13 }
        ],
        edges: [[1, 2], [2, 0], [4, 2], [2, 3]]
      },
      {
        id: "ursa_major", nameJa: "おおくま座", nameEn: "Ursa Major", category: "Constellation",
        lore: "背中に北斗七星を持つ北天の大星座。",
        stars: [
          { name: "ドゥーベ", ra: 165.93, dec: 61.75 },
          { name: "メラク", ra: 165.46, dec: 56.38 },
          { name: "フェクダ", ra: 178.45, dec: 53.69 },
          { name: "メグレズ", ra: 183.85, dec: 57.03 },
          { name: "アリオト", ra: 193.50, dec: 55.96 },
          { name: "ミザール", ra: 200.98, dec: 54.92 },
          { name: "アルカイド", ra: 206.88, dec: 49.31 }
        ],
        edges: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]]
      },
      {
        id: "scorpius", nameJa: "さそり座", nameEn: "Scorpius", category: "Constellation",
        lore: "南の低空に大きなS字を描く夏の代表的な星座。",
        stars: [
          { name: "アンタレス", ra: 247.35, dec: -26.43 },
          { name: "グラフィアス", ra: 241.36, dec: -19.80 },
          { name: "ジュバ", ra: 240.08, dec: -22.62 },
          { name: "シャウラ", ra: 263.40, dec: -37.04 }
        ],
        edges: [[1, 2], [2, 0], [0, 3]]
      }
    ];

    const state = {
      isAudioEnabled: true,
      isVibeEnabled: true,
      isCameraActive: false,
      mode: 'guide',
      targetObject: null,
      focusedObject: null,
      orientation: { alpha: 0, beta: 0, gamma: 0 },
      manualRot: { x: 0, y: 0 },
      isDragging: false,
      previousMousePosition: { x: 0, y: 0 },
      celestialData: []
    };

    class AudioEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playScanPulse(freq = 440) {
        if (!state.isAudioEnabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playLockChime() {
        if (!state.isAudioEnabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.05);
          gain.gain.setValueAtTime(0.06, now + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.05);
          osc.stop(now + idx * 0.05 + 0.25);
        });
      }
    }
    const audio = new AudioEngine();

    function triggerHaptic(pattern) {
      if (!state.isVibeEnabled || !navigator.vibrate) return;
      try { navigator.vibrate(pattern); } catch (e) {}
    }

    let scene, camera, renderer, skySphereGroup, sunLight;
    const targetableMeshList = [];
    const raycaster = new THREE.Raycaster();
    const centerScreenVec = new THREE.Vector2(0, 0);

    function initThreeSky() {
      const container = document.getElementById('skyCanvas');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: container, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      skySphereGroup = new THREE.Group();
      scene.add(skySphereGroup);

      scene.add(new THREE.AmbientLight(0xffffff, 0.4));
      sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
      scene.add(sunLight);

      const bgStarGeo = new THREE.BufferGeometry();
      const bgStarCount = 2000;
      const bgStarPos = new Float32Array(bgStarCount * 3);
      for (let i = 0; i < bgStarCount * 3; i += 3) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 280;
        bgStarPos[i] = r * Math.sin(phi) * Math.cos(theta);
        bgStarPos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
        bgStarPos[i + 2] = r * Math.cos(phi);
      }
      bgStarGeo.setAttribute('position', new THREE.BufferAttribute(bgStarPos, 3));
      skySphereGroup.add(new THREE.Points(bgStarGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.7 })));

      buildCelestialObjects();
      window.addEventListener('resize', onWindowResize);
    }

    function celestialToVector3(ra, dec, radius = 150) {
      const altAz = raDecToAltAz(ra, dec);
      const altRad = THREE.MathUtils.degToRad(altAz.alt);
      const azRad = THREE.MathUtils.degToRad(altAz.az);

      const x = radius * Math.cos(altRad) * Math.sin(azRad);
      const y = radius * Math.sin(altRad);
      const z = -radius * Math.cos(altRad) * Math.cos(azRad);

      return { vec: new THREE.Vector3(x, y, z), altAz };
    }

    function buildCelestialObjects() {
      const planets = computeCelestialPositions();
      state.celestialData = [...planets];

      planets.forEach(obj => {
        const { vec, altAz } = celestialToVector3(obj.ra, obj.dec, 140);
        obj.currentAltAz = altAz;

        let mesh;
        if (obj.id === 'sun') {
          mesh = new THREE.Mesh(new THREE.SphereGeometry(6, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
          mesh.add(new THREE.Mesh(new THREE.SphereGeometry(8.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 0.35 })));
          sunLight.position.copy(vec);
        } else if (obj.id === 'moon') {
          mesh = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 32), new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.9 }));
        } else if (obj.id === 'saturn') {
          const grp = new THREE.Group();
          grp.add(new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 32), new THREE.MeshStandardMaterial({ color: 0xe0c870 })));
          const ring = new THREE.Mesh(new THREE.RingGeometry(4.8, 7.5, 32), new THREE.MeshBasicMaterial({ color: 0xc2a856, side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
          ring.rotation.x = Math.PI / 2.5;
          grp.add(ring);
          mesh = grp;
        } else {
          mesh = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 32), new THREE.MeshStandardMaterial({ color: obj.id === 'mars' ? 0xff4422 : 0xaaaaaa }));
        }

        mesh.position.copy(vec);
        mesh.userData = { targetObject: obj };
        skySphereGroup.add(mesh);

        if (mesh.isMesh) targetableMeshList.push(mesh);
        else mesh.traverse(c => { if (c.isMesh) { c.userData = { targetObject: obj }; targetableMeshList.push(c); } });
      });

      MAJOR_STARS.forEach(star => {
        const { vec, altAz } = celestialToVector3(star.ra, star.dec, 150);
        star.currentAltAz = altAz;
        state.celestialData.push(star);

        const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        mesh.position.copy(vec);
        mesh.userData = { targetObject: star };

        skySphereGroup.add(mesh);
        targetableMeshList.push(mesh);
      });

      // Constellations with Center Target Hitting
      CONSTELLATIONS.forEach(c => {
        const group = new THREE.Group();
        const pts = [];
        let sumRa = 0, sumDec = 0;

        c.stars.forEach(s => {
          sumRa += s.ra;
          sumDec += s.dec;
          const { vec } = celestialToVector3(s.ra, s.dec, 150);
          pts.push(vec);

          const starMesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 12), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
          starMesh.position.copy(vec);
          starMesh.userData = { targetObject: { ...s, id: c.id, nameJa: `${c.nameJa} (${s.name})`, nameEn: c.nameEn, category: "Constellation Star", lore: c.lore } };
          group.add(starMesh);
          targetableMeshList.push(starMesh);
        });

        // 星座全体の中心代表ターゲット
        const centerRa = sumRa / c.stars.length;
        const centerDec = sumDec / c.stars.length;
        const { vec: centerVec } = celestialToVector3(centerRa, centerDec, 145);

        const constCenterMesh = new THREE.Mesh(
          new THREE.SphereGeometry(5.0, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.1 })
        );
        constCenterMesh.position.copy(centerVec);
        constCenterMesh.userData = { 
          targetObject: { 
            id: c.id, 
            nameJa: c.nameJa, 
            nameEn: c.nameEn, 
            ra: centerRa, 
            dec: centerDec, 
            category: "Constellation (星座)", 
            lore: c.lore 
          } 
        };
        group.add(constCenterMesh);
        targetableMeshList.push(constCenterMesh);
        state.celestialData.push(constCenterMesh.userData.targetObject);

        const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45 });
        c.edges.forEach(([i, j]) => {
          group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts[i], pts[j]]), lineMat));
        });

        skySphereGroup.add(group);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    async function startCameraFeed() {
      const video = document.getElementById('cameraFeed');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        video.classList.remove('hidden');
        state.isCameraActive = true;
        renderer.setClearColor(0x000000, 0);
      } catch (err) {
        video.classList.add('hidden');
        renderer.setClearColor(0x030712, 1);
      }
    }

    function setupOrientationEvents() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(resp => {
          if (resp === 'granted') window.addEventListener('deviceorientation', handleOrientation);
        }).catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          observer.lat = pos.coords.latitude;
          observer.lon = pos.coords.longitude;
          document.getElementById('latVal').textContent = `${observer.lat.toFixed(1)}°N`;
        }, () => {});
      }
    }

    function handleOrientation(event) {
      state.orientation.alpha = event.alpha || 0;
      state.orientation.beta = event.beta || 0;
      state.orientation.gamma = event.gamma || 0;

      const heading = Math.round(event.webkitCompassHeading || (360 - state.orientation.alpha) % 360);
      document.getElementById('headingVal').textContent = `${heading.toString().padStart(3, '0')}° ${getCompassDirection(heading)}`;
      document.getElementById('pitchVal').textContent = `${Math.round(state.orientation.beta)}°`;
      document.getElementById('compassNeedle').style.transform = `rotate(${-heading}deg)`;
    }

    function getCompassDirection(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    window.addEventListener('pointerdown', e => {
      if (e.target.closest('#hudOverlay')) return;
      state.isDragging = true;
      state.previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', e => {
      if (!state.isDragging) return;
      const deltaX = e.clientX - state.previousMousePosition.x;
      const deltaY = e.clientY - state.previousMousePosition.y;

      state.manualRot.y += deltaX * 0.004;
      state.manualRot.x += deltaY * 0.004;
      state.previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => state.isDragging = false);

    let lastVibeTime = 0;

    function animate(time) {
      requestAnimationFrame(animate);

      if (state.orientation.alpha || state.orientation.beta) {
        const alphaRad = THREE.MathUtils.degToRad(state.orientation.alpha);
        const betaRad = THREE.MathUtils.degToRad(state.orientation.beta);
        const gammaRad = THREE.MathUtils.degToRad(state.orientation.gamma);
        camera.quaternion.setFromEuler(new THREE.Euler(betaRad, alphaRad, -gammaRad, 'YXZ'));
      } else {
        camera.quaternion.setFromEuler(new THREE.Euler(state.manualRot.x, state.manualRot.y, 0, 'YXZ'));
      }

      raycaster.setFromCamera(centerScreenVec, camera);
      const intersects = raycaster.intersectObjects(targetableMeshList, true);

      if (intersects.length > 0) {
        const targetObj = intersects[0].object.userData.targetObject;
        if (targetObj && state.focusedObject !== targetObj) {
          state.focusedObject = targetObj;
          onTargetFocusEnter(targetObj);
        }

        if (time - lastVibeTime > 400) {
          triggerHaptic(30);
          audio.playScanPulse(580);
          lastVibeTime = time;
        }
      } else {
        if (state.focusedObject) {
          onTargetFocusLeave();
          state.focusedObject = null;
        }
      }

      if (state.mode === 'hunter' && state.targetObject) {
        updateHunterNavigation();
      }

      renderer.render(scene, camera);
    }

    function onTargetFocusEnter(obj) {
      document.getElementById('objectCategory').textContent = obj.category || "CELESTIAL OBJECT";
      document.getElementById('objectTitle').childNodes[0].nodeValue = obj.nameJa + " ";
      document.getElementById('objectEn').textContent = obj.nameEn ? `(${obj.nameEn})` : "";
      document.getElementById('objectLore').textContent = obj.lore || "";
      
      const altAz = raDecToAltAz(obj.ra || 0, obj.dec || 0);
      document.getElementById('coordBadge').textContent = `ALT: ${Math.round(altAz.alt)}° / AZ: ${Math.round(altAz.az)}°`;

      const infoCard = document.getElementById('infoCard');
      infoCard.classList.remove('opacity-0', 'translate-y-4');
      infoCard.classList.add('opacity-100', 'translate-y-0');

      const badge = document.getElementById('reticleBadge');
      document.getElementById('reticleBadgeText').textContent = `${obj.nameJa}`;
      badge.classList.remove('opacity-0');

      document.getElementById('reticleDot').classList.add('bg-rose-500', 'shadow-[0_0_20px_#f43f5e]');
      
      audio.playLockChime();
      triggerHaptic([40, 50, 40]);
    }

    function onTargetFocusLeave() {
      document.getElementById('reticleBadge').classList.add('opacity-0');
      document.getElementById('reticleDot').classList.remove('bg-rose-500', 'shadow-[0_0_20px_#f43f5e]');
    }

    function updateHunterNavigation() {
      const obj = state.targetObject;
      const { vec } = celestialToVector3(obj.ra || 0, obj.dec || 0, 140);

      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.multiplyScalar(-140);

      const angleDeg = THREE.MathUtils.radToDeg(camDir.angleTo(vec));
      document.getElementById('targetDist').textContent = `${Math.round(angleDeg)}°`;

      const radarPercent = Math.max(0, 100 - (angleDeg / 180) * 100);
      document.getElementById('radarBar').style.width = `${radarPercent}%`;
    }

    function buildCatalogUI(filterQuery = '') {
      const list = document.getElementById('catalogList');
      list.innerHTML = '';

      const allItems = [...state.celestialData, ...CONSTELLATIONS];
      const filtered = allItems.filter(item => {
        if (!filterQuery) return true;
        const q = filterQuery.toLowerCase();
        return (item.nameJa && item.nameJa.toLowerCase().includes(q)) || (item.nameEn && item.nameEn.toLowerCase().includes(q));
      });

      filtered.forEach(item => {
        const row = document.createElement('div');
        row.className = "glass-panel p-3 rounded-xl flex justify-between items-center cursor-pointer hover:border-cyan-400 transition-colors";
        row.innerHTML = `
          <div>
            <div class="text-[10px] font-orbitron text-cyan-400">${item.category || 'Constellation'}</div>
            <div class="text-sm font-bold text-white">${item.nameJa} <span class="text-xs text-gray-400 font-normal">(${item.nameEn || ''})</span></div>
          </div>
          <button class="px-3 py-1 bg-cyan-500/20 border border-cyan-400/50 text-cyan-300 rounded-lg text-xs font-orbitron hover:bg-cyan-500/40">
            TARGET
          </button>
        `;
        row.addEventListener('click', () => {
          state.targetObject = item;
          document.getElementById('targetName').textContent = `${(item.nameEn || item.nameJa).toUpperCase()} (${item.nameJa})`;
          document.getElementById('catalogModal').classList.add('hidden');
          setMode('hunter');
          triggerHaptic(40);
        });
        list.appendChild(row);
      });
    }

    function setMode(newMode) {
      state.mode = newMode;
      document.getElementById('modeGuideBtn').classList.toggle('active', newMode === 'guide');
      document.getElementById('modeHunterBtn').classList.toggle('active', newMode === 'hunter');
      document.getElementById('modeCatalogBtn').classList.toggle('active', newMode === 'catalog');

      document.getElementById('radarContainer').classList.toggle('hidden', newMode !== 'hunter');

      if (newMode === 'catalog') {
        buildCatalogUI();
        document.getElementById('catalogModal').classList.remove('hidden');
      } else {
        document.getElementById('catalogModal').classList.add('hidden');
      }

      if (newMode === 'hunter' && !state.targetObject) {
        state.targetObject = state.celestialData[0];
        document.getElementById('targetName').textContent = `${state.targetObject.nameEn.toUpperCase()} (${state.targetObject.nameJa})`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initThreeSky();

      document.getElementById('startSensorsBtn').addEventListener('click', () => {
        audio.init();
        setupOrientationEvents();
        startCameraFeed();
        document.getElementById('permissionModal').classList.add('hidden');
        triggerHaptic([50, 50]);
        animate(0);
      });

      document.getElementById('catalogSearch').addEventListener('input', (e) => {
        buildCatalogUI(e.target.value);
      });

      document.getElementById('modeGuideBtn').addEventListener('click', () => setMode('guide'));
      document.getElementById('modeHunterBtn').addEventListener('click', () => setMode('hunter'));
      document.getElementById('modeCatalogBtn').addEventListener('click', () => setMode('catalog'));
      document.getElementById('closeCatalogBtn').addEventListener('click', () => setMode('guide'));

      document.getElementById('toggleAudioBtn').addEventListener('click', (e) => {
        state.isAudioEnabled = !state.isAudioEnabled;
        e.currentTarget.innerHTML = `<i class="fa-solid fa-volume-${state.isAudioEnabled ? 'high' : 'xmark'} text-xs"></i>`;
        triggerHaptic(30);
      });

      document.getElementById('toggleVibeBtn').addEventListener('click', (e) => {
        state.isVibeEnabled = !state.isVibeEnabled;
        e.currentTarget.classList.toggle('text-rose-400', !state.isVibeEnabled);
        triggerHaptic(30);
      });

      document.getElementById('toggleCamBtn').addEventListener('click', () => {
        const video = document.getElementById('cameraFeed');
        if (state.isCameraActive) {
          if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
          video.classList.add('hidden');
          renderer.setClearColor(0x030712, 1);
          state.isCameraActive = false;
        } else {
          startCameraFeed();
        }
        triggerHaptic(30);
      });
    });
  </script>
