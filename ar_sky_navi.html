<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>星空ARナビゲーター - AR Celestial & Constellation Hunter</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;800&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      background-color: #030712;
      color: #f3f4f6;
      overflow: hidden;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* Glassmorphism Styles */
    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-btn {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-btn:active, .glass-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    /* Reticle animations */
    @keyframes pulse-lock {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      100% { transform: scale(1); opacity: 0.8; }
    }

    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-spin-slow {
      animation: rotate-slow 20s linear infinite;
    }

    .reticle-locked {
      animation: pulse-lock 1s infinite ease-in-out;
      border-color: #38bdf8 !important;
    }

    /* Custom Scrollbar for Catalog */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4);
      border-radius: 3px;
    }
  </style>
</head>
<body class="relative h-screen w-screen bg-slate-950 text-slate-100 overflow-hidden">

  <!-- Camera Feed Background Layer -->
  <video id="cameraFeed" class="absolute inset-0 w-full h-full object-cover z-0 hidden" autoplay playsinline muted></video>

  <!-- WebGL Canvas Layer -->
  <canvas id="skyCanvas" class="absolute inset-0 w-full h-full z-10 block pointer-events-auto"></canvas>

  <!-- HUD Overlay Layer -->
  <div class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-4 sm:p-6">

    <!-- Top Bar Header -->
    <header class="flex items-center justify-between w-full pointer-events-auto">
      <div class="flex items-center gap-3 glass-panel px-4 py-2 rounded-2xl">
        <div class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-sky-500"></span>
        </div>
        <div>
          <h1 class="text-xs sm:text-sm font-extrabold tracking-wider font-orbitron text-sky-400 uppercase">AR SKY NAVIGATOR</h1>
          <p class="text-[10px] text-slate-400 font-mono" id="hudSensorStatus">MODE: GYRO / TOUCH</p>
        </div>
      </div>

      <!-- Quick Action Toggles -->
      <div class="flex items-center gap-2">
        <button id="btnToggleAR" class="glass-btn pointer-events-auto p-2.5 rounded-xl text-slate-300 hover:text-sky-400 focus:outline-none" title="ARカメラモード切替">
          <i data-lucide="camera" class="w-5 h-5"></i>
        </button>
        <button id="btnToggleSound" class="glass-btn pointer-events-auto p-2.5 rounded-xl text-slate-300 hover:text-sky-400 focus:outline-none" title="効果音オン/オフ">
          <i data-lucide="volume-2" id="iconSound" class="w-5 h-5"></i>
        </button>
        <button id="btnOpenCatalog" class="glass-btn pointer-events-auto px-3.5 py-2 rounded-xl text-sky-400 font-semibold text-xs flex items-center gap-1.5 hover:bg-sky-500/20" title="天体カタログ">
          <i data-lucide="search" class="w-4 h-4"></i>
          <span class="hidden sm:inline font-orbitron">CATALOG</span>
        </button>
      </div>
    </header>

    <!-- Center Reticle & Target Lock Visualizer -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none flex flex-col items-center justify-center">
      
      <!-- Outer Rotating Radar Circle -->
      <div id="reticleOuter" class="w-48 h-48 sm:w-64 sm:h-64 border border-dashed border-sky-500/30 rounded-full animate-spin-slow flex items-center justify-center relative">
        <div class="absolute -top-1 w-2 h-2 bg-sky-400 rounded-full"></div>
        <div class="absolute -bottom-1 w-2 h-2 bg-sky-400 rounded-full"></div>
      </div>

      <!-- Main Center Crosshair Ring -->
      <div id="reticleCenter" class="absolute w-20 h-20 sm:w-24 sm:h-24 border-2 border-sky-400/60 rounded-full transition-all duration-300 flex items-center justify-center">
        <!-- Reticle Cross Lines -->
        <div class="absolute w-full h-[1px] bg-sky-400/40"></div>
        <div class="absolute h-full w-[1px] bg-sky-400/40"></div>
        <div id="reticleDot" class="w-2 h-2 bg-sky-400 rounded-full transition-all duration-200"></div>
      </div>

      <!-- Real-Time Lock Status Badge & Info Frame -->
      <div id="targetInfoBox" class="mt-28 sm:mt-36 glass-panel px-4 py-2.5 rounded-xl flex flex-col items-center min-w-[220px] transition-all duration-300 transform opacity-90">
        <div class="flex items-center gap-2 mb-0.5">
          <span id="targetTypeTag" class="text-[9px] font-orbitron font-extrabold px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30 uppercase">SCANNING</span>
          <span id="targetOffsetDeg" class="text-[10px] font-mono text-slate-400">OFFSET: --°</span>
        </div>
        <h2 id="targetNameJa" class="text-sm sm:text-base font-bold text-slate-100 tracking-wide">天体をキャプチャ中...</h2>
        <p id="targetNameEn" class="text-[10px] font-orbitron text-sky-400 tracking-wider">SEARCHING SKY</p>
        <div id="targetCoords" class="text-[9px] font-mono text-slate-400 mt-1 flex gap-3">
          <span>RA: <span id="targetRA">--h --m</span></span>
          <span>DEC: <span id="targetDEC">--° --'</span></span>
        </div>
      </div>
    </div>

    <!-- Navigation / Directional Hunter Arrow (Shown when catalog object selected) -->
    <div id="hunterNavPanel" class="hidden absolute top-20 left-1/2 -translate-x-1/2 glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 pointer-events-auto border-emerald-500/40">
      <div id="hunterArrow" class="w-7 h-7 text-emerald-400 flex items-center justify-center transform transition-transform duration-100">
        <i data-lucide="navigation" class="w-6 h-6 fill-emerald-400/20"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-orbitron text-emerald-400 font-bold">TARGET LOCKED</span>
          <span id="hunterDistance" class="text-xs font-mono font-bold text-slate-200">0.0°</span>
        </div>
        <p id="hunterTargetName" class="text-xs font-bold text-slate-100">オリオン座</p>
      </div>
      <button id="btnClearTarget" class="p-1 text-slate-400 hover:text-red-400">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Bottom Controls & Navigation -->
    <footer class="w-full flex items-end justify-between pointer-events-auto">
      
      <!-- Telescope Field-of-View Zoom Slider -->
      <div class="glass-panel p-2.5 rounded-2xl flex flex-col gap-1.5 items-center">
        <span class="text-[9px] font-orbitron text-slate-400">FOV</span>
        <input type="range" id="zoomSlider" min="20" max="80" value="50" class="h-24 text-sky-500 bg-slate-800 rounded-lg appearance-none cursor-pointer [writing-mode:vertical-lr] [direction:rtl]">
        <span id="zoomValue" class="text-[10px] font-mono text-sky-400">50°</span>
      </div>

      <!-- Quick Category Filters -->
      <div class="glass-panel px-3 py-1.5 rounded-2xl flex items-center gap-1 sm:gap-2">
        <button data-filter="all" class="filter-btn active px-3 py-1.5 rounded-xl text-xs font-bold glass-btn text-sky-400">すべて</button>
        <button data-filter="planet" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium glass-btn text-slate-300">太陽・惑星</button>
        <button data-filter="constellation" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium glass-btn text-slate-300">星座</button>
        <button data-filter="star" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium glass-btn text-slate-300">恒星</button>
        <button data-filter="dso" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-medium glass-btn text-slate-300">深宇宙</button>
      </div>

      <!-- Gyro Sensor Calibrate Button -->
      <button id="btnCalibrate" class="glass-panel p-3 rounded-2xl text-slate-300 hover:text-sky-400 flex flex-col items-center justify-center gap-1" title="ジャイロ再調整">
        <i data-lucide="compass" class="w-5 h-5 text-sky-400"></i>
        <span class="text-[9px] font-orbitron">CALIB</span>
      </button>
    </footer>
  </div>

  <!-- Catalog Modal Layer -->
  <div id="catalogModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="glass-panel w-full max-w-2xl max-h-[85vh] rounded-3xl p-5 flex flex-col border-sky-500/30 shadow-2xl">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-700/60">
        <div class="flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5 text-sky-400"></i>
          <h3 class="text-base sm:text-lg font-bold font-orbitron text-slate-100">天体・星座カタログ</h3>
        </div>
        <button id="btnCloseCatalog" class="p-2 rounded-xl text-slate-400 hover:text-slate-100 glass-btn">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Search Input -->
      <div class="my-4 relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="catalogSearch" placeholder="天体名、星座名、メシエ番号で検索..." class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-700/80 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-sky-500 transition-colors">
      </div>

      <!-- Catalog List Container -->
      <div id="catalogList" class="flex-1 overflow-y-auto space-y-2 pr-1 my-2">
        <!-- Items dynamically inserted via JS -->
      </div>
    </div>
  </div>

  <!-- Detailed Object View Modal -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="glass-panel w-full max-w-lg rounded-3xl p-6 border-sky-500/40 relative">
      <button id="btnCloseDetail" class="absolute top-4 right-4 p-2 rounded-xl text-slate-400 hover:text-slate-100 glass-btn">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="flex items-center gap-3 mb-2">
        <span id="detailBadge" class="text-xs font-orbitron font-extrabold px-2.5 py-1 rounded-md bg-sky-500/20 text-sky-300 border border-sky-500/30 uppercase">PLANET</span>
        <span id="detailMag" class="text-xs font-mono text-amber-400">Mag: -2.5</span>
      </div>

      <h2 id="detailTitleJa" class="text-2xl font-black text-slate-100 mb-0.5">木星</h2>
      <p id="detailTitleEn" class="text-xs font-orbitron text-sky-400 tracking-wider mb-4">JUPITER</p>

      <p id="detailDesc" class="text-sm text-slate-300 leading-relaxed mb-6">
        太陽系第5惑星。太陽系内で最大の質量を持つ巨大ガス惑星。特徴的な大赤斑と数多くの衛星群を持つ。
      </p>

      <div class="grid grid-cols-2 gap-3 mb-6 font-mono text-xs">
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
          <span class="text-slate-400 block text-[10px] font-sans">赤経 (RA)</span>
          <span id="detailRA" class="text-sky-300 font-bold">18h 45m</span>
        </div>
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
          <span class="text-slate-400 block text-[10px] font-sans">赤緯 (DEC)</span>
          <span id="detailDEC" class="text-sky-300 font-bold">+23° 12'</span>
        </div>
      </div>

      <button id="btnLockTarget" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-sky-500/25 transition-all">
        <i data-lucide="crosshair" class="w-5 h-5"></i>
        <span>この天体をターゲットにロック</span>
      </button>
    </div>
  </div>

    lucide.createIcons();

    /* =========================================================================
       2. THREE.JS ENGINE & AR CELESTIAL CANVAS
       ========================================================================= */
    let scene, camera, renderer;
    let sphereRadius = 500;
    let celestialMeshes = [];
    let activeTarget = null;
    let isSoundOn = true;
    let audioCtx = null;

    // View Orientation Angles
    let pitch = 0; // Vertical angle (-90 to +90)
    let yaw = 0;   // Horizontal angle (0 to 360)
    let isDragging = false;
    let previousTouch = { x: 0, y: 0 };

    // Device orientation calibration offset
    let gyroOffset = { alpha: 0, beta: 0, gamma: 0 };
    let useGyro = false;

    function initThree() {
      const container = document.getElementById('skyCanvas');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: container, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Ambient Light for Planets
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      // Sun Point Light
      const sunLight = new THREE.PointLight(0xffffff, 1.5, 1000);
      scene.add(sunLight);

      buildBackgroundStarfield();
      buildCelestialObjects();

      window.addEventListener('resize', onWindowResize);
      setupControls();
    }

    // Convert Equatorial Coordinates (RA hours, Dec degrees) to 3D Cartesian Position
    function raDecToVector3(raHours, decDeg, radius = sphereRadius) {
      const raRad = (raHours * 15) * (Math.PI / 180);
      const decRad = decDeg * (Math.PI / 180);

      const x = radius * Math.cos(decRad) * Math.sin(raRad);
      const y = radius * Math.sin(decRad);
      const z = radius * Math.cos(decRad) * Math.cos(raRad);

      return new THREE.Vector3(x, y, z);
    }

    // Procedural Background Deep Stars Generator
    function buildBackgroundStarfield() {
      const starGeometry = new THREE.BufferGeometry();
      const starCount = 3000;
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = sphereRadius * 0.98;

        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);

        // Soft white-blue star tones
        colors[i * 3] = 0.8 + Math.random() * 0.2;
        colors[i * 3 + 1] = 0.85 + Math.random() * 0.15;
        colors[i * 3 + 2] = 1.0;
      }

      starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const starMaterial = new THREE.PointsMaterial({
        size: 1.5,
        vertexColors: true,
        transparent: true,
        opacity: 0.8
      });

      const starPoints = new THREE.Points(starGeometry, starMaterial);
      scene.add(starPoints);
    }

    // Build Detailed 3D Objects for Celestial Data
    function buildCelestialObjects() {
      CELESTIAL_DATA.forEach(obj => {
        const group = new THREE.Group();
        const pos = raDecToVector3(obj.ra, obj.dec);
        group.position.copy(pos);

        if (obj.type === 'planet') {
          // Planet Spherical Geometry
          const geom = new THREE.SphereGeometry(obj.size * 2, 32, 32);
          const mat = new THREE.MeshStandardMaterial({
            color: obj.color,
            roughness: 0.6,
            metalness: 0.1,
            emissive: obj.id === 'sun' ? 0xffaa00 : 0x000000,
            emissiveIntensity: obj.id === 'sun' ? 0.8 : 0.0
          });
          const mesh = new THREE.Mesh(geom, mat);
          group.add(mesh);

          // Saturn Ring Special Mesh
          if (obj.hasRings) {
            const ringGeom = new THREE.RingGeometry(obj.size * 2.8, obj.size * 4.5, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xd2b48c, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            const ringMesh = new THREE.Mesh(ringGeom, ringMat);
            ringMesh.rotation.x = Math.PI / 3;
            group.add(ringMesh);
          }

        } else if (obj.type === 'star') {
          // Glowing Star Points
          const geom = new THREE.SphereGeometry(obj.size * 1.2, 16, 16);
          const mat = new THREE.MeshBasicMaterial({ color: obj.color });
          const mesh = new THREE.Mesh(geom, mat);
          group.add(mesh);

        } else if (obj.type === 'dso') {
          // Deep Sky Nebular Glow Effect
          const geom = new THREE.SphereGeometry(obj.size * 2.2, 16, 16);
          const mat = new THREE.MeshBasicMaterial({ color: obj.color, transparent: true, opacity: 0.4, wireframe: true });
          const mesh = new THREE.Mesh(geom, mat);
          group.add(mesh);

        } else if (obj.type === 'constellation' && obj.lines) {
          // Constellation Skeleton Lines & Joint Stars
          const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65, linewidth: 2 });
          
          obj.lines.forEach(pair => {
            const p1 = raDecToVector3(pair[0], pair[1]);
            const p2 = raDecToVector3(pair[2], pair[3]);

            const lineGeom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            const line = new THREE.Line(lineGeom, lineMat);
            scene.add(line); // Constellations rendered in global sky coordinates
          });

          // Core indicator node for Constellation Center
          const centerGeom = new THREE.OctahedronGeometry(3, 0);
          const centerMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
          const centerMesh = new THREE.Mesh(centerGeom, centerMat);
          group.add(centerMesh);
        }

        scene.add(group);
        celestialMeshes.push({ data: obj, group: group, worldPos: pos });
      });
    }

    /* =========================================================================
       3. INTERACTION, TOUCH & GYROSCOPE ORIENTATION
       ========================================================================= */
    function setupControls() {
      const canvas = document.getElementById('skyCanvas');

      // Mouse & Touch Drag Controls
      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        previousTouch = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousTouch.x;
        const deltaY = e.clientY - previousTouch.y;

        yaw -= deltaX * 0.15;
        pitch += deltaY * 0.15;

        // Pitch clamp (-85 to +85 deg)
        pitch = Math.max(-85, Math.min(85, pitch));

        previousTouch = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointerup', () => { isDragging = false; });

      // Gyroscope Motion Listeners
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    function handleOrientation(event) {
      if (event.alpha === null || !useGyro) return;
      
      document.getElementById('hudSensorStatus').innerText = "MODE: HARDWARE GYRO";

      // Convert sensor Alpha/Beta/Gamma to Sky Pitch & Yaw
      let alpha = event.alpha - gyroOffset.alpha;
      let beta = event.beta - gyroOffset.beta;

      yaw = -alpha;
      pitch = beta - 90;
      pitch = Math.max(-85, Math.min(85, pitch));
    }

    /* =========================================================================
       4. REAL-TIME CENTER RETICLE TRACKING & LOCK-ON ENGINE
       ========================================================================= */
    let lastLockedId = null;

    function updateCenterReticleTracking() {
      // Current Camera Forward Vector
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);

      let minAngle = Infinity;
      let closestTarget = null;

      // Scan through celestial database for closest object in center sight
      celestialMeshes.forEach(item => {
        const targetDir = item.worldPos.clone().normalize();
        const angleDeg = (dir.angleTo(targetDir) * 180) / Math.PI;

        if (angleDeg < minAngle) {
          minAngle = angleDeg;
          closestTarget = item;
        }
      });

      const reticleCenter = document.getElementById('reticleCenter');
      const reticleDot = document.getElementById('reticleDot');
      const targetBox = document.getElementById('targetInfoBox');

      // Lock Threshold: 4.5 degrees
      if (closestTarget && minAngle < 4.5) {
        const obj = closestTarget.data;

        document.getElementById('targetTypeTag').innerText = obj.type.toUpperCase();
        document.getElementById('targetOffsetDeg').innerText = `OFFSET: ${minAngle.toFixed(1)}°`;
        document.getElementById('targetNameJa').innerText = obj.nameJa;
        document.getElementById('targetNameEn').innerText = obj.nameEn;
        
        // Coordinates display
        document.getElementById('targetRA').innerText = `${obj.ra}h`;
        document.getElementById('targetDEC').innerText = `${obj.dec > 0 ? '+' : ''}${obj.dec}°`;

        reticleCenter.classList.add('reticle-locked');
        reticleDot.classList.add('bg-sky-300', 'scale-150');

        // Play Lock Audio & Haptic Feedback when crossing into a new lock
        if (lastLockedId !== obj.id) {
          triggerLockFeedback();
          lastLockedId = obj.id;
        }

      } else {
        // Unlocked Default Scanning View
        document.getElementById('targetTypeTag').innerText = 'SCANNING';
        document.getElementById('targetOffsetDeg').innerText = `OFFSET: --°`;
        document.getElementById('targetNameJa').innerText = '天体をサーチ中...';
        document.getElementById('targetNameEn').innerText = 'SEARCHING SKY';
        document.getElementById('targetRA').innerText = '--h --m';
        document.getElementById('targetDEC').innerText = "--° --'";

        reticleCenter.classList.remove('reticle-locked');
        reticleDot.classList.remove('bg-sky-300', 'scale-150');
        lastLockedId = null;
      }

      // Update Navigation Pointer Arrow if target locked from catalog
      if (activeTarget) {
        updateHunterDirectionArrow();
      }
    }

    // Directional Hunter Arrow pointing to user-selected target
    function updateHunterDirectionArrow() {
      const targetItem = celestialMeshes.find(m => m.data.id === activeTarget.id);
      if (!targetItem) return;

      const cameraDir = new THREE.Vector3();
      camera.getWorldDirection(cameraDir);

      const targetDir = targetItem.worldPos.clone().normalize();
      const angleDeg = (cameraDir.angleTo(targetDir) * 180) / Math.PI;

      document.getElementById('hunterDistance').innerText = `${angleDeg.toFixed(1)}°`;

      // Project target position to screen space for arrow angle
      const projected = targetItem.worldPos.clone().project(camera);
      const angleRad = Math.atan2(projected.y, projected.x);
      const angleDeg2D = (angleRad * 180) / Math.PI;

      document.getElementById('hunterArrow').style.transform = `rotate(${-angleDeg2D}deg)`;
    }

    /* =========================================================================
       5. AUDIO & HAPTIC FEEDBACK SYNTHESIZER
       ========================================================================= */
    function triggerLockFeedback() {
      // Haptic Vibration
      if (navigator.vibrate) {
        navigator.vibrate([30, 40, 30]);
      }

      // Web Audio API Beep Synthesizer
      if (!isSoundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note tone
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log('Audio playback prevented');
      }
    }

    /* =========================================================================
       6. UI CATALOG & MODAL MANAGEMENT
       ========================================================================= */
    function populateCatalog(filterType = 'all', searchQuery = '') {
      const catalogList = document.getElementById('catalogList');
      catalogList.innerHTML = '';

      const filtered = CELESTIAL_DATA.filter(item => {
        const matchesFilter = filterType === 'all' || item.type === filterType;
        const matchesSearch = item.nameJa.includes(searchQuery) || 
                              item.nameEn.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.id.includes(searchQuery);
        return matchesFilter && matchesSearch;
      });

      filtered.forEach(obj => {
        const itemEl = document.createElement('div');
        itemEl.className = 'glass-btn p-3 rounded-2xl flex items-center justify-between cursor-pointer hover:border-sky-400/50 transition-all';
        itemEl.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center font-orbitron font-bold text-sky-400 text-xs uppercase">
              ${obj.type.substring(0,2)}
            </div>
            <div>
              <h4 class="text-sm font-bold text-slate-100">${obj.nameJa}</h4>
              <p class="text-[10px] font-orbitron text-sky-400">${obj.nameEn}</p>
            </div>
          </div>
          <button class="p-2 text-sky-400 hover:bg-sky-500/20 rounded-xl" title="詳細表示">
            <i data-lucide="info" class="w-4 h-4"></i>
          </button>
        `;

        itemEl.addEventListener('click', () => {
          openDetailModal(obj);
          document.getElementById('catalogModal').classList.add('hidden');
        });

        catalogList.appendChild(itemEl);
      });

      lucide.createIcons();
    }

    function openDetailModal(obj) {
      document.getElementById('detailBadge').innerText = obj.type.toUpperCase();
      document.getElementById('detailMag').innerText = obj.mag ? `Mag: ${obj.mag}` : 'Constellation';
      document.getElementById('detailTitleJa').innerText = obj.nameJa;
      document.getElementById('detailTitleEn').innerText = obj.nameEn;
      document.getElementById('detailDesc').innerText = obj.desc || '宇宙の深遠に位置する神秘的な天体。';
      document.getElementById('detailRA').innerText = `${obj.ra}h`;
      document.getElementById('detailDEC').innerText = `${obj.dec > 0 ? '+' : ''}${obj.dec}°`;

      const detailModal = document.getElementById('detailModal');
      detailModal.classList.remove('hidden');
      setTimeout(() => detailModal.classList.remove('opacity-0'), 10);

      // Lock target button setup
      document.getElementById('btnLockTarget').onclick = () => {
        activeTarget = obj;
        document.getElementById('hunterTargetName').innerText = obj.nameJa;
        document.getElementById('hunterNavPanel').classList.remove('hidden');
        
        // Point camera towards selected target
        yaw = -(obj.ra * 15);
        pitch = obj.dec;

        detailModal.classList.add('opacity-0');
        setTimeout(() => detailModal.classList.add('hidden'), 300);
      };
    }

    /* =========================================================================
       7. EVENT LISTENERS & INITIALIZATION
       ========================================================================= */
    function initEvents() {
      // Zoom FOV Slider
      const zoomSlider = document.getElementById('zoomSlider');
      zoomSlider.addEventListener('input', (e) => {
        camera.fov = parseFloat(e.target.value);
        camera.updateProjectionMatrix();
        document.getElementById('zoomValue').innerText = `${e.target.value}°`;
      });

      // Filter Category Buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'text-sky-400'));
          e.target.classList.add('active', 'text-sky-400');
          populateCatalog(e.target.dataset.filter);
        });
      });

      // AR Camera Video Toggle
      const btnToggleAR = document.getElementById('btnToggleAR');
      const cameraFeed = document.getElementById('cameraFeed');
      btnToggleAR.addEventListener('click', async () => {
        if (cameraFeed.classList.contains('hidden')) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            cameraFeed.srcObject = stream;
            cameraFeed.classList.remove('hidden');
            btnToggleAR.classList.add('active');
          } catch (err) {
            alert('カメラの起動に失敗しました。アクセス権限を確認してください。');
          }
        } else {
          const stream = cameraFeed.srcObject;
          if (stream) stream.getTracks().forEach(track => track.stop());
          cameraFeed.classList.add('hidden');
          btnToggleAR.classList.remove('active');
        }
      });

      // Toggle Sound Effect
      document.getElementById('btnToggleSound').addEventListener('click', () => {
        isSoundOn = !isSoundOn;
        const icon = document.getElementById('iconSound');
        icon.setAttribute('data-lucide', isSoundOn ? 'volume-2' : 'volume-x');
        lucide.createIcons();
      });

      // Calibrate Gyro
      document.getElementById('btnCalibrate').addEventListener('click', () => {
        useGyro = true;
        gyroOffset = { alpha: yaw, beta: pitch + 90, gamma: 0 };
        triggerLockFeedback();
      });

      // Catalog Modal Controls
      document.getElementById('btnOpenCatalog').addEventListener('click', () => {
        populateCatalog();
        const catalogModal = document.getElementById('catalogModal');
        catalogModal.classList.remove('hidden');
        setTimeout(() => catalogModal.classList.remove('opacity-0'), 10);
      });

      document.getElementById('btnCloseCatalog').addEventListener('click', () => {
        const catalogModal = document.getElementById('catalogModal');
        catalogModal.classList.add('opacity-0');
        setTimeout(() => catalogModal.classList.add('hidden'), 300);
      });

      document.getElementById('catalogSearch').addEventListener('input', (e) => {
        populateCatalog('all', e.target.value);
      });

      // Close Detail Modal
      document.getElementById('btnCloseDetail').addEventListener('click', () => {
        const detailModal = document.getElementById('detailModal');
        detailModal.classList.add('opacity-0');
        setTimeout(() => detailModal.classList.add('hidden'), 300);
      });

      // Clear Hunter Target
      document.getElementById('btnClearTarget').addEventListener('click', () => {
        activeTarget = null;
        document.getElementById('hunterNavPanel').classList.add('hidden');
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* =========================================================================
       8. MAIN ANIMATION LOOP
       ========================================================================= */
    function animate() {
      requestAnimationFrame(animate);

      // Convert Yaw and Pitch into Camera Rotation
      const pitchRad = pitch * (Math.PI / 180);
      const yawRad = yaw * (Math.PI / 180);

      camera.rotation.order = 'YXZ';
      camera.rotation.y = yawRad;
      camera.rotation.x = pitchRad;

      // Rotate planet mesh rings slowly for visual realism
      celestialMeshes.forEach(item => {
        if (item.data.type === 'planet') {
          item.group.rotation.y += 0.005;
        }
      });

      updateCenterReticleTracking();
      renderer.render(scene, camera);
    }

    // Start App on Window Load
    window.onload = () => {
      initThree();
      initEvents();
      animate();
    };
  </script>
</body>
</html>
