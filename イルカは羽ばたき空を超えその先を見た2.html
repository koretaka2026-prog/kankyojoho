<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Neon Cyber Dash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      background: #0d0f18;
    }
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 0 0 8px rgba(0,243,255,0.8);
      z-index: 10;
    }
    .hud div {
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(0,243,255,0.3);
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 10, 15, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    h1 {
      font-size: 2.5rem;
      color: #00f3ff;
      text-shadow: 0 0 15px #00f3ff;
      margin-bottom: 10px;
      text-align: center;
    }
    p {
      color: #aaa;
      margin-bottom: 25px;
      text-align: center;
      max-width: 80%;
      line-height: 1.5;
    }
    .btn {
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #0d0f18;
      background: #00f3ff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,243,255,0.6);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.95);
    }
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 10;
    }
    .touch-group {
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(0, 243, 255, 0.5);
      color: #00f3ff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .touch-btn:active {
      background: rgba(0, 243, 255, 0.4);
    }
    @media (min-width: 769px) {
      #touch-controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="hud">
      <div id="score-display">SCORE: 0</div>
      <div id="high-display">HIGH: 0</div>
    </div>
    <canvas id="canvas"></canvas>
    
    <div id="overlay">
      <h1 id="title">NEON CYBER DASH</h1>
      <p id="desc">PC: [W]/[S] Key or [▲]/[▼] Arrow Keys to Move, [Space] to Dash<br>Mobile: Use On-screen Buttons</p>
      <button class="btn" id="start-btn">START GAME</button>
    </div>

    <div id="touch-controls">
      <div class="touch-group">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-down">▼</div>
      </div>
      <div class="touch-group">
        <div class="touch-btn" id="btn-dash" style="width:75px; height:65px; border-radius:15px; font-size:14px; font-weight:bold;">DASH</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const scoreDisplay = document.getElementById('score-display');
    const highDisplay = document.getElementById('high-display');

    let gameActive = false;
    let score = 0;
    let highScore = localStorage.getItem('neon_dash_high') || 0;
    highDisplay.innerText = `HIGH: ${highScore}`;

    let canvasWidth, canvasHeight;
    function resize() {
      const aspect = 16 / 9;
      let w = window.innerWidth;
      let h = window.innerHeight;
      if (w / h > aspect) {
        w = h * aspect;
      } else {
        h = w / aspect;
      }
      canvas.width = w;
      canvas.height = h;
      canvasWidth = w;
      canvasHeight = h;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio API 音声生成
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSound(freq, type, duration) {
      if (!audioCtx) audioCtx = new AudioContext();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    // プレイヤー設定
    const player = {
      x: 0.15,
      y: 0.5,
      size: 24,
      vy: 0,
      speed: 0.008,
      isDashing: false,
      dashTimer: 0
    };

    let obstacles = [];
    let items = [];
    let particles = [];
    let frameCount = 0;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // スマホタッチボタン設定
    const setupBtn = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
      el.addEventListener('mousedown', () => keys[key] = true);
      el.addEventListener('mouseup', () => keys[key] = false);
    };
    setupBtn('btn-up', 'KeyW');
    setupBtn('btn-down', 'KeyS');
    setupBtn('btn-dash', 'Space');

    function resetGame() {
      score = 0;
      player.y = 0.5;
      player.isDashing = false;
      player.dashTimer = 0;
      obstacles = [];
      items = [];
      particles = [];
      frameCount = 0;
      gameActive = true;
      overlay.style.display = 'none';
    }

    startBtn.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new AudioContext();
      resetGame();
    });

    function spawnObstacle() {
      const size = Math.random() * 30 + 20;
      obstacles.push({
        x: 1.1,
        y: Math.random() * (1 - size / canvasHeight),
        width: size / canvasWidth,
        height: (size * (1 + Math.random())) / canvasHeight,
        speed: 0.005 + Math.random() * 0.003 + (score * 0.00005)
      });
    }

    function spawnItem() {
      items.push({
        x: 1.1,
        y: Math.random() * 0.8 + 0.1,
        size: 15
      });
    }

    function createExplosion(x, y, color) {
      for(let i=0; i<15; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          life: 1.0,
          color: color
        });
      }
    }

    function update() {
      if (!gameActive) return;

      frameCount++;
      score++;
      scoreDisplay.innerText = `SCORE: ${score}`;

      // 移動
      if (keys['KeyW'] || keys['ArrowUp']) player.y -= player.speed;
      if (keys['KeyS'] || keys['ArrowDown']) player.y += player.speed;
      player.y = Math.max(0.05, Math.min(0.95, player.y));

      // ダッシュ
      if (keys['Space'] && player.dashTimer <= 0) {
        player.isDashing = true;
        player.dashTimer = 60;
        playSound(600, 'square', 0.2);
      }

      if (player.dashTimer > 0) {
        player.dashTimer--;
        if (player.dashTimer < 40) player.isDashing = false;
      }

      // スポーン処理
      if (frameCount % 40 === 0) spawnObstacle();
      if (frameCount % 120 === 0) spawnItem();

      // 障害物更新
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= obs.speed;

        let px = player.x * canvasWidth;
        let py = player.y * canvasHeight;
        let ox = obs.x * canvasWidth;
        let oy = obs.y * canvasHeight;
        let ow = obs.width * canvasWidth;
        let oh = obs.height * canvasHeight;

        if (px + player.size > ox && px - player.size < ox + ow &&
            py + player.size > oy && py - player.size < oy + oh) {
          if (player.isDashing) {
            createExplosion(ox + ow/2, oy + oh/2, '#ff0055');
            obstacles.splice(i, 1);
            score += 200;
            playSound(300, 'sawtooth', 0.15);
          } else {
            gameOver();
          }
        } else if (obs.x < -0.2) {
          obstacles.splice(i, 1);
        }
      }

      // アイテム更新
      for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.x -= 0.004;

        let px = player.x * canvasWidth;
        let py = player.y * canvasHeight;
        let ix = it.x * canvasWidth;
        let iy = it.y * canvasHeight;

        let dist = Math.hypot(px - ix, py - iy);
        if (dist < player.size + it.size) {
          score += 500;
          createExplosion(ix, iy, '#00f3ff');
          items.splice(i, 1);
          playSound(800, 'sine', 0.2);
        } else if (it.x < -0.1) {
          items.splice(i, 1);
        }
      }

      // パーティクル更新
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function gameOver() {
      gameActive = false;
      playSound(150, 'sawtooth', 0.5);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neon_dash_high', highScore);
        highDisplay.innerText = `HIGH: ${highScore}`;
      }
      document.getElementById('title').innerText = "GAME OVER";
      document.getElementById('desc').innerText = `Final Score: ${score}`;
      startBtn.innerText = "TRY AGAIN";
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      // グリッド背景
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
      ctx.lineWidth = 1;
      let gridStep = 40;
      for (let x = 0; x < canvasWidth; x += gridStep) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke();
      }
      for (let y = 0; y < canvasHeight; y += gridStep) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke();
      }

      if (gameActive || particles.length > 0) {
        // プレイヤー描画
        let px = player.x * canvasWidth;
        let py = player.y * canvasHeight;

        ctx.shadowBlur = player.isDashing ? 25 : 12;
        ctx.shadowColor = player.isDashing ? '#ff0055' : '#00f3ff';
        ctx.fillStyle = player.isDashing ? '#ff0055' : '#00f3ff';

        ctx.beginPath();
        ctx.moveTo(px + player.size, py);
        ctx.lineTo(px - player.size, py - player.size / 1.5);
        ctx.lineTo(px - player.size / 2, py);
        ctx.lineTo(px - player.size, py + player.size / 1.5);
        ctx.closePath();
        ctx.fill();

        // 障害物描画
        ctx.shadowColor = '#ff0055';
        ctx.fillStyle = '#ff0055';
        obstacles.forEach(obs => {
          ctx.fillRect(obs.x * canvasWidth, obs.y * canvasHeight, obs.width * canvasWidth, obs.height * canvasHeight);
        });

        // アイテム描画
        ctx.shadowColor = '#ffe600';
        ctx.fillStyle = '#ffe600';
        items.forEach(it => {
          ctx.beginPath();
          ctx.arc(it.x * canvasWidth, it.y * canvasHeight, it.size, 0, Math.PI * 2);
          ctx.fill();
        });

        // パーティクル描画
        particles.forEach(p => {
          ctx.shadowBlur = 5;
          ctx.shadowColor = p.color;
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.fillRect(p.x, p.y, 4, 4);
          ctx.globalAlpha = 1.0;
        });

        ctx.shadowBlur = 0;
      }

      requestAnimationFrame(() => {
        update();
        draw();
      });
    }

    draw();
  </script>
</body>
</html>
