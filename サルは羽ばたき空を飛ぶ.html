<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>スマホ用ブロック崩し</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body { background: #222; text-align: center; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        canvas { background: #111; display: block; margin: 0 auto; max-width: 100%; max-height: 80vh; border: 2px solid #fff; }
        h1 { color: #fff; font-size: 1.2rem; padding: 10px; font-family: sans-serif; }
    </style>
</head>
<body>

<h1>画面をスワイプしてパドルを動かそう！</h1>
<canvas id="gameCanvas" width="320" height="480"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ボールの設定
let ballRadius = 8;
let x = canvas.width / 2;
let y = canvas.height - 30;
let dx = 3;
let dy = -3;

// パドルの設定
let paddleHeight = 12;
let paddleWidth = 75;
let paddleX = (canvas.width - paddleWidth) / 2;

// ブロックの設定
const brickRowCount = 4;
const brickColumnCount = 5;
const brickWidth = 50;
const brickHeight = 15;
const brickPadding = 7;
const brickOffsetTop = 30;
const brickOffsetLeft = 20;

let bricks = [];
for(let c=0; c<brickColumnCount; c++) {
    bricks[c] = [];
    for(let r=0; r<brickRowCount; r++) {
        bricks[c][r] = { x: 0, y: 0, status: 1 };
    }
}

// スマホのタッチ操作イベント
document.addEventListener("touchmove", (e) => {
    let relativeX = e.touches[0].clientX - canvas.offsetLeft;
    if(relativeX > 0 && relativeX < canvas.width) {
        paddleX = relativeX - paddleWidth / 2;
    }
}, { passive: true });

// 衝突判定
function collisionDetection() {
    for(let c=0; c<brickColumnCount; c++) {
        for(let r=0; r<brickRowCount; r++) {
            let b = bricks[c][r];
            if(b.status == 1) {
                if(x > b.x && x < b.x+brickWidth && y > b.y && y < b.y+brickHeight) {
                    dy = -dy;
                    b.status = 0;
                    if(isWin()) {
                        alert("クリア！おめでとう！");
                        document.location.reload();
                    }
                }
            }
        }
    }
}

function isWin() {
    for(let c=0; c<brickColumnCount; c++) {
        for(let r=0; r<brickRowCount; r++) {
            if(bricks[c][r].status == 1) return false;
        }
    }
    return true;
}

// 描画処理
function drawBall() {
    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI*2);
    ctx.fillStyle = "#FF5722";
    ctx.fill();
    ctx.closePath();
}

function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddleX, canvas.height-paddleHeight, paddleWidth, paddleHeight);
    ctx.fillStyle = "#009688";
    ctx.fill();
    ctx.closePath();
}

function drawBricks() {
    for(let c=0; c<brickColumnCount; c++) {
        for(let r=0; r<brickRowCount; r++) {
            if(bricks[c][r].status == 1) {
                let brickX = (c*(brickWidth+brickPadding))+brickOffsetLeft;
                let brickY = (r*(brickHeight+brickPadding))+brickOffsetTop;
                bricks[c][r].x = brickX;
                bricks[c][r].y = brickY;
                ctx.beginPath();
                ctx.rect(brickX, brickY, brickWidth, brickHeight);
                ctx.fillStyle = "#FFC107";
                ctx.fill();
                ctx.closePath();
            }
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawBall();
    drawPaddle();
    collisionDetection();
    
    // 壁でのバウンド
    if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) { dx = -dx; }
    if(y + dy < ballRadius) { dy = -dy; }
    else if(y + dy > canvas.height-ballRadius) {
        // パドルに当たったか
        if(x > paddleX && x < paddleX + paddleWidth) {
            dy = -dy;
        }
        else {
            alert("ゲームオーバー");
            document.location.reload();
        }
    }
    
    x += dx;
    y += dy;
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
