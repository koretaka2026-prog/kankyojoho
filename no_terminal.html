const MIS=['荷物車で少年を探す','荷札13のトランクを調べる','荷札13について少年に尋ねる','荷物車でバールを探す','荷札13のトランクをこじ開ける','トランク内の乗客記録を読む','食堂車のティーポットを調べる','食堂車の蒸気分岐弁を開く','解けたティーポットの座席札を取る','通常世界で寝台車の呼び鈴を押す','裏世界へ入り、呼び鈴を押す','裏世界で寝台車の小鏡を調べる','名前の消えた私物札を取る','車窓観測器を調べる','裏世界で路線表示板を調べる','零下駅の標示片を読む','裏世界の無番号車両で乗客名簿を読む','終点なし'];
const CARS=[[1,7,'機関車',5],[8,14,'荷物車',0],[15,21,'食堂車',2],[22,28,'寝台車',1],[29,35,'展望車',-1],[36,44,'無番号車両',-7]];
// ---------- 状態 ----------
let px=5,py=7,ang=0,world='n',st=0,temp=8,bob=0,bt=0,flash=0,drop=0,paused=true,started=false,ended=false,target=null,jx=0,jy=0,stepT=0,lockT=0,last=0,inv=[];
const keys={};
// ---------- UI ----------
let nT,bT;
function note(s,ms=3400){const n=$('note');n.textContent=s;n.style.opacity=1;clearTimeout(nT);nT=setTimeout(()=>n.style.opacity=0,ms)}
function big(t,s){const b=$('big');b.firstChild.textContent=t;b.lastChild.textContent=s;b.style.opacity=1;clearTimeout(bT);bT=setTimeout(()=>b.style.opacity=0,4200)}
let docEnd=false;
function doc(t,b,end){$('dt').textContent=t;$('db').textContent=b;$('doc').style.display='flex';paused=true;docEnd=!!end;snd('bell')}
$('doc').addEventListener('pointerdown',()=>{$('doc').style.display='none';if(docEnd){ended=true;$('title').querySelector('h2').textContent='終点なし';$('title').querySelector('p').textContent='あなたの名前は、名簿に戻された。列車は、まだ走っている。';$('start').textContent='もう一度';$('title').style.display='flex'}else paused=false});
// ---------- 音 ----------
let AC,mg,NB;
function audio(){try{AC=new(window.AudioContext||webkitAudioContext)();mg=AC.createGain();mg.gain.value=.8;mg.connect(AC.destination);
const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=140;const g=AC.createGain();g.gain.value=.07;[43,43.7,86.3].forEach(fr=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start()});f.connect(g);g.connect(mg);
NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const bf=AC.createBiquadFilter();bf.type='bandpass';bf.frequency.value=500;const ng=AC.createGain();ng.gain.value=.03;s.connect(bf);bf.connect(ng);ng.connect(mg);s.start()}catch(e){}}
function snd(k){if(!AC)return;try{const t=AC.currentTime,g=AC.createGain();g.connect(mg);
if(k==='step'){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=220;s.connect(f);f.connect(g);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);s.start(t,Math.random(),.15)}
else{const o=AC.createOscillator(),sh=k==='shift';o.type=sh?'sawtooth':'sine';o.frequency.setValueAtTime(sh?90:660,t);o.frequency.exponentialRampToValueAtTime(sh?900:330,t+.9);o.connect(g);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+1);o.start(t);o.stop(t+1)}}catch(e){}}
// ---------- 当たり判定・扉 ----------
function solid(x,y,w=world){const c=(grids[w][y|0]||'')[x|0];if(c==='.')return false;if(c==='D'){const d=doors[(x|0)+','+(y|0)];return !d||d.p<.8}return true}
const hit=(x,y)=>solid(x-.2,y-.2)||solid(x+.2,y-.2)||solid(x-.2,y+.2)||solid(x+.2,y+.2);
function unlock(){const d=doors;d['15,6'].lock=st<6;d['22,6'].lock=st<9;d['29,6'].lock=st<13;d['36,6'].lock=st<16;$('bWorld').style.display=st>=9?'block':'none'}
function adv(n){st=n;unlock()}
// ---------- 調べる ----------
function act(){const o=target;if(!o||paused)return;snd('pick');
const give=s=>{if(!inv.includes(s))inv.push(s);$('inv').textContent=inv.join(' / ')};
switch(o.id){
case'engine':note(LORE[0]);break;
case'gauge':note('針は零下を指したまま動かない。');break;
case'boy':if(st===0){note('少年「…来たんだね。荷札13のトランクには、近づかないほうがいい。」');adv(1)}
 else if(st===2){note('少年「十三人目は、最初から乗っていなかった。…ううん、名簿から消されたんだ。バールがあれば開くよ。」',5000);adv(3)}
 else note('少年は小さくうなずいて、窓の外を見ている。');break;
case'trunk':if(st===1){note('荷札には「13」。風もないのに、錆びた札が揺れている。');adv(2)}
 else if(st===4){if(inv.includes('バール')){o.l='開いたトランク';O.rec1.a=1;note('バールを差し込むと、氷が砕けた。中に乗客記録がある。');adv(5)}else note('固く凍りついている。てこになる物が必要だ。')}
 else if(st>4)note('トランクは空っぽだ。');else note('荷札13のトランク。今は触れないほうがいい気がする。');break;
case'crow':give('バール');o.a=0;note('赤錆びたバールを拾った。');if(st===3)adv(4);break;
case'rec1':o.a=0;doc('凍りついた乗客記録',LORE[0]+'\n\n十三番目の氏名だけが、名簿から削られている。');adv(6);big('第一章　完','食堂車への連結扉が解錠された');break;
case'kettle':if(st===6){note('ティーポットは氷の塊だ。蒸気で解かすしかない。');adv(7)}else if(st>=8)note('解けた湯が、座席の方へ細く流れている。');else note('凍ったティーポット。');break;
case'steamD':if(st===7){note('蒸気の脈動が食堂車を満たし、氷が解けていく…');O.plate.a=1;adv(8)}else note('弁は温かい。');break;
case'plate':o.a=0;give('座席札13');doc('座席札13',LORE[1]+'\n\n十三人分の食器。その一席だけ、名前がない。');adv(9);big('第二章　完','寝台車への連結扉が解錠された');setTimeout(()=>note('Yボタンで表と裏の世界を行き来できる'),4500);break;
case'bell':if(st===9&&world==='n'){note('鈴の音が、少し遅れて返ってきた。「裏世界」ボタンで裏側へ。',5000);adv(10)}
 else if(st===10&&world==='w'){note('裏側では鈴が鳴らない。代わりに、誰かが息を吸う音がした。');adv(11)}
 else if(st===10)note('もう一度、裏世界で鳴らしてみよう。');else note('寝台呼び鈴。');break;
case'smir':if(st===11&&world==='w'){note('鏡には、あなたの後ろに十三人目が立っている。');O.tag.a=1;adv(12)}else note(world==='w'?'鏡は何も映さない。':'鏡は曇っている。');break;
case'tag':o.a=0;give('私物札');doc('名前の消えた私物札',LORE[2]+'\n\n十三台目の寝台には、あなたの私物が残されていた。');adv(13);big('第三章　完','展望車への連結扉が解錠された');break;
case'cons':if(st===13){note('車窓に、存在しない駅の灯りが並ぶ。4回目の観測で、灯りが目を開いた。',5000);adv(14)}else note('観測器の針が震えている。');break;
case'route':if(st===14&&world==='w'){note('路線図の終点だけ、凍らずに残っている。');O.stat.a=1;adv(15)}else if(st===14)note('凍結していて読めない。裏世界なら…');else note('路線表示板は凍結している。');break;
case'stat':o.a=0;give('零下駅の標示片');doc('零下駅の標示片',LORE[3]+'\n\n存在しない駅名が、無番号車両への扉を開いた。');adv(16);big('第四章　完','無番号車両への連結扉が解錠された');break;
case'reg':if(st===16&&world==='w'){doc('乗客名簿',LORE[4]+'\n\nあなたは自分の名札を、名簿の十三番目に戻した。\n少年の荷札は、ゆっくりと温かくなっていく。\n\n――終点は、ない。',1);adv(17)}else note('名簿は凍りついている。');break}}
function toggle(){if(paused)return;if(st<9){note('何も起きない。');return}const w=world==='n'?'w':'n';if(hit2(w)){note('壁の中へは入れない…');return}world=w;flash=1;snd('shift')}
const hit2=w=>solid(px-.2,py-.2,w)||solid(px+.2,py-.2,w)||solid(px-.2,py+.2,w)||solid(px+.2,py+.2,w);
// ---------- 描画 ----------
function init(){const w=innerWidth,h=innerHeight;RW=w>h?400:280;RH=clamp(Math.round(RW*h/w),160,300);cv.width=RW;cv.height=RH;img=cx.createImageData(RW,RH);for(let i=3;i<img.data.length;i+=4)img.data[i]=255;
proj=RW/2/Math.tan(FOV/2);zb=new Float32Array(RW);OFF=[];CS=[];IC=[];for(let x=0;x<RW;x++){const o=Math.atan((x+.5-RW/2)/proj);OFF.push(o);CS.push(Math.cos(o));IC.push(1/Math.cos(o))}}
function render(t){const W=RW,H=RH,D=img.data,half=((H>>1)+bob)|0,T=TX[world],sa=Math.sin(ang),ca=Math.cos(ang);
const fl=Math.max(.15,.93+.07*Math.sin(t*37)*Math.sin(t*11.3)-drop*.65);
const lamp=(x,y,s)=>{const lx=Math.round((x-1.75)/3.5)*3.5+1.75,a=x-lx,b=(y-6.5)*s;return .3+1.4/(1+.35*(a*a+b*b))};
for(let x=0;x<W;x++){DX[x]=Math.cos(ang+OFF[x]);DY[x]=Math.sin(ang+OFF[x])}
for(let y=0;y<H;y++){if(y===half)continue;const f=y>half,rd=.5*proj/Math.abs(y-half);
 for(let x=0;x<W;x++){const k=rd*IC[x],wx=px+DX[x]*k,wy=py+DY[x]*k,tx=f?(Math.abs(wy-6.5)<.7?T.K:T.F):T.C,
  ti=((((wy*64)&63)*64)+((wx*64)&63))*4,L=(lamp(wx,wy,f?1.6:1)+.35/(1+rd*.35))*fl/(1+rd*.04),i=(y*W+x)*4,gr=(Math.random()-.5)*12;
  D[i]=tx[ti]*L+gr;D[i+1]=tx[ti+1]*L+gr;D[i+2]=tx[ti+2]*L+gr}}
const grid=grids[world];
for(let x=0;x<W;x++){const rx=DX[x],ry=DY[x];let mx=px|0,my=py|0;const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry),sx=rx<0?-1:1,sy=ry<0?-1:1;
 let sdx=(rx<0?px-mx:mx+1-px)*ddx,sdy=(ry<0?py-my:my+1-py)*ddy,side=0,tt=0,ch='1',u=0;
 for(let n=0;n<64;n++){if(sdx<sdy){tt=sdx;sdx+=ddx;mx+=sx;side=0}else{tt=sdy;sdy+=ddy;my+=sy;side=1}
  ch=(grid[my]||'')[mx]||'1';if(ch==='.')continue;let wu=side?px+rx*tt:py+ry*tt;wu-=Math.floor(wu);
  if(ch==='D'){const d=doors[mx+','+my];if(d&&(d.p>.985||wu<d.p))continue;wu-=d?d.p:0}u=wu;break}
 const pp=tt*CS[x];zb[x]=pp;const lh=proj/pp,top=half-lh/2,y0=Math.max(0,top|0),y1=Math.min(H-1,(top+lh)|0),tx=T[ch],
  uu=(((side?(ry<0?u:1-u):(rx>0?u:1-u))*64)&63),hx=px+rx*tt,hy=py+ry*tt,L=(lamp(hx,hy,.5)+.4/(1+pp*.4))*fl*(side?.82:1)/(1+pp*.04);
 for(let y=y0;y<=y1;y++){const v=(((y-top)/lh*64)&63),ti=(v*64+uu)*4,i=(y*W+x)*4,gr=(Math.random()-.5)*12;
  D[i]=tx[ti]*L+gr;D[i+1]=tx[ti+1]*L+gr;D[i+2]=tx[ti+2]*L+gr}}
// スプライト
target=null;let best=9;
const sp=[];for(const o of OBJ){if(!o.a||(o.w!=='b'&&o.w!==world))continue;const rx=o.x-px,ry=o.y-py,dp=rx*ca+ry*sa;if(dp<.25||dp>16)continue;const lat=-rx*sa+ry*ca;sp.push({o,dp,lat});
 if(o.i&&dp<2.3&&dp<best&&Math.abs(lat)/dp<.32&&zb[W>>1]>dp*.9){best=dp;target=o}}
sp.sort((a,b)=>b.dp-a.dp);
for(const s of sp){const o=s.o;const tx=SP[o.k]||(SP[o.k]=mk(o.k)),kk=K[o.k],size=proj/s.dp*kk[0],bot=half+proj/s.dp*(.5-kk[1]),sx=W/2+s.lat/s.dp*proj,x0=sx-size/2,y0=bot-size,
 L=(lamp(o.x,o.y,.8)+.4/(1+s.dp*.4))*fl/(1+s.dp*.05),hi=o===target?42:0;
 for(let xx=Math.max(0,x0|0);xx<Math.min(W,x0+size);xx++){if(zb[xx]<s.dp)continue;const u=((xx-x0)/size*64)|0;
  for(let yy=Math.max(0,y0|0);yy<Math.min(H,bot);yy++){const v=((yy-y0)/size*64)|0,ti=(v*64+u)*4;if(tx[ti+3]<60)continue;const i=(yy*W+xx)*4,wr=world==='w'?.78:1;
   D[i]=tx[ti]*L+hi;D[i+1]=tx[ti+1]*L*wr+hi;D[i+2]=tx[ti+2]*L*wr+hi}}}
cx.putImageData(img,0,0)}
// ---------- 更新 ----------
function update(dt,t){
 let mvx=jx,mvy=jy;if(keys.w||keys.arrowup)mvy-=1;if(keys.s||keys.arrowdown)mvy+=1;if(keys.a)mvx-=1;if(keys.d)mvx+=1;
 if(keys.arrowleft)ang-=1.8*dt;if(keys.arrowright)ang+=1.8*dt;
 const m=Math.hypot(mvx,mvy);if(m>1){mvx/=m;mvy/=m}
 const sp=2.3,vx=(Math.cos(ang)*-mvy-Math.sin(ang)*mvx)*sp*dt,vy=(Math.sin(ang)*-mvy+Math.cos(ang)*mvx)*sp*dt;
 if(!hit(px+vx,py))px+=vx;if(!hit(px,py+vy))py+=vy;
 const mv=Math.hypot(mvx,mvy);if(mv>.1){bt+=dt*9;bob=Math.sin(bt)*2.2*mv;stepT-=dt;if(stepT<=0){snd('step');stepT=.5}}else bob*=.85;
 for(const k in doors){const d=doors[k],[a,b]=k.split(',').map(Number),dist=Math.hypot(px-a-.5,py-b-.5),want=!d.lock&&dist<1.9?1:0;
  d.p=clamp(d.p+Math.sign(want-d.p)*dt*1.2,0,1);if(d.lock&&dist<1.6&&t-lockT>3&&grids[world][b][a]==='D'){lockT=t;note('連結扉は施錠されている。')}}
 const car=CARS.find(c=>px>=c[0]&&px<=c[1])||CARS[5],tg=6+car[3]-(world==='w'?6:0);temp+=(tg-temp)*dt*.08;
 drop=Math.max(0,drop-dt*3);if(Math.random()<(world==='w'?.012:.003))drop=1;flash=Math.max(0,flash-dt*1.2);
 $('flash').style.opacity=flash;$('frost').style.opacity=clamp((5-temp)/12,0,.85);
 $('hud').innerHTML='<b>'+(world==='w'?'裏世界':'')+' '+car[2]+'</b>　気温 '+temp.toFixed(0)+'℃<br>目的：'+MIS[st];
 const p=$('prompt');if(target&&!paused){p.textContent='調べる：'+target.l;p.style.opacity=1}else p.style.opacity=0}
function loop(ms){const t=ms/1000,dt=Math.min(.05,t-last);last=t;if(!paused)update(dt,t);render(t);requestAnimationFrame(loop)}
// ---------- 入力 ----------
const ptr={};
function stick(x,y,v){const r=$('ring'),k=$('knob');r.style.display=k.style.display=v?'block':'none';if(v){r.style.left=x+'px';r.style.top=y+'px';k.style.left=x+'px';k.style.top=y+'px'}}
document.addEventListener('pointerdown',e=>{if(!started||paused||e.target.closest('.btn'))return;
 if(e.pointerType==='mouse'){cv.requestPointerLock&&cv.requestPointerLock();return}
 const s=e.clientX<innerWidth*.45;ptr[e.pointerId]={x:e.clientX,y:e.clientY,ox:e.clientX,oy:e.clientY,s};if(s)stick(e.clientX,e.clientY,1)});
document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){if(document.pointerLockElement&&!paused)ang+=e.movementX*.0025;return}
 const p=ptr[e.pointerId];if(!p)return;
 if(p.s){let vx=e.clientX-p.ox,vy=e.clientY-p.oy;const m=Math.hypot(vx,vy),R=55;if(m>R){vx*=R/m;vy*=R/m}jx=vx/R;jy=vy/R;const k=$('knob');k.style.left=p.ox+vx+'px';k.style.top=p.oy+vy+'px'}
 else{ang+=(e.clientX-p.x)*.0055;p.x=e.clientX;p.y=e.clientY}});
const up=e=>{const p=ptr[e.pointerId];if(p&&p.s){jx=jy=0;stick(0,0,0)}delete ptr[e.pointerId]};
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
$('bAct').addEventListener('pointerdown',e=>{e.preventDefault();act()});
$('bWorld').addEventListener('pointerdown',e=>{e.preventDefault();toggle()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==='e'||k===' '||k==='enter')act();if(k==='y')toggle()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('resize',init);
document.addEventListener('contextmenu',e=>e.preventDefault());
$('start').addEventListener('click',()=>{if(ended){location.reload();return}
 $('title').style.display='none';started=true;paused=false;init();audio();
 try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
 unlock();note('左側をドラッグで移動、右側をドラッグで視点。荷物車の少年を探そう。',5200);requestAnimationFrame(loop)});
init();
</script></body></html>
