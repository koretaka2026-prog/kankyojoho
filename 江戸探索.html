<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>江戸探索3D v3</title><style>body{margin:0;overflow:hidden}#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;padding:10px;border-radius:8px;z-index:9}</style><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script></head><body><div id="ui">江戸探索v3<br>WASD移動・マウス視点<br>橋・坂道・当たり判定対応</div><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0xaad8ff);scene.fog=new THREE.Fog(0xaad8ff,80,350);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,2000);camera.position.set(0,2,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,.9));const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(50,100,50);scene.add(sun);const colliders=[];const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshLambertMaterial({color:0xc7ad74}));ground.rotation.x=-Math.PI/2;scene.add(ground);function addBox(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);scene.add(m);return m;}function house(x,z){const b=addBox(x,2.5,z,8,5,8,0x8b5a2b);colliders.push(new THREE.Box3().setFromObject(b));const roof=new THREE.Mesh(new THREE.ConeGeometry(7,4,4),new THREE.MeshLambertMaterial({color:0x333333}));roof.position.set(x,7,z);roof.rotation.y=Math.PI/4;scene.add(roof);}for(let i=0;i<14;i++){house(-28,i*15+20);house(28,i*15+20);}const hill=new THREE.Mesh(new THREE.CylinderGeometry(40,55,10,32),new THREE.MeshLambertMaterial({color:0x73aa54}));hill.position.set(50,5,80);scene.add(hill);const shrine=addBox(50,15,80,16,10,16,0xdd3333);colliders.push(new THREE.Box3().setFromObject(shrine));const castleBase=addBox(110,6,200,34,12,34,0x888888);colliders.push(new THREE.Box3().setFromObject(castleBase));addBox(110,17,200,24,10,24,0xf5f5f5);addBox(110,27,200,18,10,18,0xf5f5f5);const roof=new THREE.Mesh(new THREE.ConeGeometry(14,8,4),new THREE.MeshLambertMaterial({color:0x115522}));roof.position.set(110,38,200);roof.rotation.y=Math.PI/4;scene.add(roof);const river=addBox(-70,-1,140,20,2,250,0x3377ff);const bridge=addBox(-70,3,140,30,1.5,10,0x8b4513);for(let i=-3;i<=3;i+=6){addBox(-70,5,140+i,30,.5,.5,0x5a3311);}const npc=addBox(0,2,50,2,4,2,0x2244ff);const keys={};let running=true,pitch=0;document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')running=false});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.body.onclick=()=>renderer.domElement.requestPointerLock();document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;camera.rotation.y-=e.movementX*0.002;pitch=Math.max(-1.1,Math.min(1.1,pitch-e.movementY*0.002));camera.rotation.x=pitch;});function terrainHeight(x,z){let h=2;if(Math.hypot(x-50,z-80)<40)h=7; if(Math.abs(x+70)<15&&Math.abs(z-140)<18)h=4; return h;}function move(){const old=camera.position.clone();const d=new THREE.Vector3();camera.getWorldDirection(d);d.y=0;d.normalize();const r=new THREE.Vector3().crossVectors(d,new THREE.Vector3(0,1,0));const s=.3;if(keys.w)camera.position.add(d.clone().multiplyScalar(s));if(keys.s)camera.position.add(d.clone().multiplyScalar(-s));if(keys.a)camera.position.add(r.clone().multiplyScalar(-s));if(keys.d)camera.position.add(r.clone().multiplyScalar(s));camera.position.y=terrainHeight(camera.position.x,camera.position.z);const pbox=new THREE.Box3().setFromCenterAndSize(camera.position.clone(),new THREE.Vector3(2,4,2));for(const c of colliders){if(pbox.intersectsBox(c)){camera.position.copy(old);camera.position.y=terrainHeight(camera.position.x,camera.position.z);break;}}}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});function loop(){if(!running)return;requestAnimationFrame(loop);move();renderer.render(scene,camera);}loop();</script></body></html>
